<title>Boiler Design Calc</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: drafting-sheet calculation. Sticky status bar, summary strip, then one ruled block per code check
   (inputs left, workings right). Palette: blueprint ink on cool paper, green/red only for results. */
:root{
  --bg:#f2f5f7; --panel:#ffffff; --ink:#14212b; --muted:#5b6b78; --line:#d3dce3; --line2:#e6ecf0;
  --accent:#0d5c73; --accent-ink:#ffffff;
  --in-bg:#fff8d6; --in-ink:#10399c; --in-line:#e3d58a;
  --pass:#0f6b3a; --pass-bg:#d8f0e1; --fail:#a11d1d; --fail-bg:#f8d9d9; --na:#5b6b78; --na-bg:#e7ecf0;
  --f-head:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --panel:#162029; --ink:#e4ebf0; --muted:#8fa0ad; --line:#2a3945; --line2:#223039;
  --accent:#5fb7cc; --accent-ink:#0b1217;
  --in-bg:#2a2711; --in-ink:#9fc0ff; --in-line:#5a5224;
  --pass:#6fd39b; --pass-bg:#16382a; --fail:#ff8d8d; --fail-bg:#43201f; --na:#9fb0bc; --na-bg:#212d36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --panel:#162029; --ink:#e4ebf0; --muted:#8fa0ad; --line:#2a3945; --line2:#223039;
  --accent:#5fb7cc; --accent-ink:#0b1217;
  --in-bg:#2a2711; --in-ink:#9fc0ff; --in-line:#5a5224;
  --pass:#6fd39b; --pass-bg:#16382a; --fail:#ff8d8d; --fail-bg:#43201f; --na:#9fb0bc; --na-bg:#212d36; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:12px 0;display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1{font:600 20px/1.15 var(--f-head);margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.grow{flex:1 1 280px;min-width:0}
.overall{font:600 13px var(--f-head);letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:3px;white-space:nowrap}
.overall.pass{background:var(--pass-bg);color:var(--pass)}.overall.fail{background:var(--fail-bg);color:var(--fail)}
button{font:500 13px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:3px;cursor:pointer}
button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);padding:10px 14px;margin:16px 0;font-size:13px;color:var(--muted)}
.note b{color:var(--ink)}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 10px;margin:16px 0 22px}
.chip{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:3px;text-decoration:none;color:var(--ink);min-width:0}
.chip span:first-child{min-width:0;overflow-wrap:anywhere;font-size:13px}
.tag{font:600 11px var(--f-head);letter-spacing:.07em;padding:2px 7px;border-radius:2px;white-space:nowrap}
.tag.pass{background:var(--pass-bg);color:var(--pass)}.tag.fail{background:var(--fail-bg);color:var(--fail)}.tag.na{background:var(--na-bg);color:var(--na)}
details.sec{background:var(--panel);border:1px solid var(--line);margin:0 0 10px;border-radius:3px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;gap:10px 14px;align-items:center;padding:11px 14px;flex-wrap:wrap}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"+";font:500 16px var(--f-mono);color:var(--accent);width:14px}
details.sec[open]>summary::before{content:"−"}
details.sec>summary .t{font:600 15px var(--f-head);flex:1 1 220px;min-width:0}
details.sec>summary .r{font:400 12px var(--f-mono);color:var(--muted)}
.body{display:grid;grid-template-columns:minmax(260px,5fr) minmax(300px,6fr);gap:0;border-top:1px solid var(--line)}
.body>div{padding:12px 14px;min-width:0}
.body>div+div{border-left:1px solid var(--line)}
.h{font:600 11px var(--f-head);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.fld{display:grid;grid-template-columns:1fr 112px 44px;gap:6px;align-items:center;padding:3px 0}
.fld label{font-size:12.5px;min-width:0;overflow-wrap:anywhere}
.fld .u{font:12px var(--f-mono);color:var(--muted)}
.fld select.matsel{grid-column:2/4;max-width:none}
.fld small{grid-column:1/-1;color:var(--muted);font-size:11.5px;margin-top:-2px}
input[type=number],select{width:100%;font:500 13px var(--f-mono);background:var(--in-bg);color:var(--in-ink);border:1px solid var(--in-line);padding:5px 6px;border-radius:2px;text-align:right}
select{text-align:left}
input[type=text].tx{width:100%;font:500 12px var(--f-mono);background:var(--in-bg);color:var(--in-ink);border:1px solid var(--in-line);padding:4px 5px;border-radius:2px}
table.res{width:100%;border-collapse:collapse}
table.res td{padding:4px 0;border-bottom:1px solid var(--line2);vertical-align:baseline}
table.res td.l{padding-right:10px;font-size:12.5px;overflow-wrap:anywhere}
table.res td.v{text-align:right;font:500 13px var(--f-mono);white-space:nowrap}
table.res td.u{width:46px;padding-left:6px;font:12px var(--f-mono);color:var(--muted)}
table.res tr.b td{font-weight:600}
.fm{font:12px/1.5 var(--f-mono);color:var(--accent);margin:8px 0 3px}
.verdict{margin-top:12px;padding:9px 11px;font:600 13px var(--f-body);border-radius:3px}
.verdict.pass{background:var(--pass-bg);color:var(--pass)}.verdict.fail{background:var(--fail-bg);color:var(--fail)}.verdict.na{background:var(--na-bg);color:var(--na)}
.nz{overflow-x:auto;padding:12px 14px;border-top:1px solid var(--line)}
table.nzt{border-collapse:collapse;min-width:100%}
table.nzt th,table.nzt td{padding:3px 5px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;font:12.5px var(--f-mono)}
table.nzt th:first-child,table.nzt td:first-child{text-align:left;font-family:var(--f-body);white-space:normal;min-width:260px;position:sticky;left:0;background:var(--panel)}
table.nzt thead th{font:600 12px var(--f-head);color:var(--muted);letter-spacing:.05em}
table.nzt input{width:84px;padding:3px 4px}
table.nzt tr.grp td{font:600 11px var(--f-head);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);background:var(--bg);text-align:left}
table.nzt td.pass{background:var(--pass-bg);color:var(--pass);font-weight:600}
table.nzt td.fail{background:var(--fail-bg);color:var(--fail);font-weight:600}
.row2{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 14px;border-top:1px solid var(--line)}
.row2 .fld{grid-template-columns:200px 100px 34px}
button.x{padding:0 6px;font:600 14px/1.4 var(--f-body);margin-left:4px;color:var(--muted)}button.x:disabled{opacity:.35;cursor:default}
table.nzt td .u{font:11px var(--f-mono);color:var(--muted)}select.matsel{min-width:130px;max-width:190px;font-size:12px}
.row2 button{align-self:center}
.sug{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--ink)}
.sug button{padding:4px 10px;font-size:12.5px;border-color:var(--accent);color:var(--accent)}
table.rt{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}table.rt th,table.rt td{padding:4px 6px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
table.rt td.n{text-align:right;font-family:var(--f-mono);white-space:nowrap}table.rt tr.gov td{background:var(--warn-bg);font-weight:600}table.rt th{color:var(--muted);font-weight:600;font-size:11.5px}
.why-m{display:none;margin:2px 0 0;font-size:11.5px}
@media (max-width:760px){table.rt td.n{white-space:normal}table.rt th:nth-child(3),table.rt td:nth-child(3){display:none}.why-m{display:block}}
.proj{background:var(--panel);border:1px solid var(--line);padding:10px 14px;margin:14px 0 0}
.proj .pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 12px}
.proj label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.proj input[type=text],.proj input[type=date]{font:500 13px var(--f-body);background:var(--in-bg);color:var(--in-ink);border:1px solid var(--in-line);padding:5px 6px;border-radius:2px;width:100%}
.proj .pb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.proj .pb select{width:auto;max-width:260px;text-align:left;font-family:var(--f-body)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
button.tab{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:7px 14px;border-radius:3px 3px 0 0;min-width:150px;text-align:left;font:600 15px var(--f-head);letter-spacing:.04em}
button.tab small{font:400 11.5px var(--f-body);color:var(--muted);letter-spacing:0}
button.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.tab[aria-selected="true"] small{color:var(--accent-ink);opacity:.85}
:root{--warn:#8a5a00;--warn-bg:#fbebc8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--warn:#ffc864;--warn-bg:#3d2f10}}
:root[data-theme="dark"]{--warn:#ffc864;--warn-bg:#3d2f10}
.overall.warn{background:var(--warn-bg);color:var(--warn)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.verdict.warn{background:var(--warn-bg);color:var(--warn)}
table.nzt td.txt{white-space:normal;min-width:120px;max-width:220px;text-align:left}
table.nzt select.matsel{max-width:170px}
@media (max-width:760px){button.tab{min-width:0;flex:1 1 30%}button.tab small{display:none}}
[hidden]{display:none!important}
footer{color:var(--muted);font-size:12px;margin-top:22px}
@media (max-width:760px){.body{grid-template-columns:1fr}.body>div+div{border-left:0;border-top:1px solid var(--line)}.fld{grid-template-columns:1fr 100px 40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
<header class="top">
  <div class="grow"><h1 id="ttl">Boiler Calculation</h1>
  <p class="sub" id="sub"></p></div>
  <span id="overall" class="overall" role="status" aria-live="polite"></span>
  <button id="undoBtn" type="button" disabled title="Undo (Ctrl+Z when not typing in a field)" aria-label="Undo">↶ Undo</button>
  <button id="redoBtn" type="button" disabled title="Redo (Ctrl+Y)" aria-label="Redo">↷ Redo</button>
  <button id="copyBtn" type="button">Copy summary</button>
  <button id="resetBtn" type="button">Load example data</button>
</header>
<nav id="tabs" class="tabs" role="tablist" aria-label="Boiler model"></nav>

<section class="proj" aria-label="Project">
  <div class="pg">
    <label>Project<input id="m-proj" type="text" placeholder="e.g. Boiler No.1"></label>
    <label>Document no.<input id="m-doc" type="text"></label>
    <label>Revision<input id="m-rev" type="text" size="4"></label>
    <label>Prepared by<input id="m-by" type="text"></label>
    <label>Date<input id="m-date" type="date"></label>
  </div>
  <div class="pb">
    <button id="saveBtn" type="button" data-db hidden>Save project</button>
    <select id="projList" data-db hidden aria-label="Saved projects"></select>
    <button id="openBtn" type="button" data-db hidden>Open</button>
    <button id="delBtn" type="button" data-db hidden>Delete</button>
    <button id="expJson" type="button">Export file (.json)</button>
    <button id="impJson" type="button">Import file</button><input type="file" id="impFile" accept=".json,application/json" hidden>
    <button id="pdfBtn" type="button">Export PDF</button>
    <button id="csvBtn" type="button" title="All inputs, workings and results, one value per row, for Excel">Export CSV (Excel)</button>
    <span id="projMsg" class="sub" role="status" style="margin:0"></span>
  </div>
</section>
<div class="note" id="noteBox"></div>

<div id="sumgrid" class="sumgrid"></div>
<section class="proj" id="rateBox" aria-labelledby="rateH" style="margin:-8px 0 18px">
  <div class="pb" style="margin:0"><b id="rateH" style="font:600 14px var(--f-head)">Pressure rating</b>
  <span class="sub" style="margin:0;flex:1 1 300px">Highest design pressure each check allows, everything else unchanged. Shows which part governs.</span>
  <button id="rateBtn" type="button">Find maximum pressure</button></div>
  <div id="rateOut" aria-live="polite"></div>
</section>
<div id="secs" role="tabpanel" aria-label="Calculation sections"></div>
<footer id="footBox"></footer>
<p class="sub" id="fpBox" style="font-family:var(--f-mono)"></p>
</div>
