<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: workbench — parts library | zinc mounting-plate canvas | inspector, PLC drawer under the plate */
:root{
  --bg:#e4e9ec; --panel:#f7f9fa; --panel2:#edf1f4; --ink:#15202b; --muted:#5a6876; --line:#c8d1d8;
  --accent:#0b67a3; --accent-ink:#ffffff; --accent-soft:#d7e8f4;
  --plate:#dbe2e6; --dot:#aebbc5; --glass:rgba(247,249,250,.9);
  --dev:#f2f2ee; --devline:#87939c; --band:#27313b; --bandink:#eef2f4;
  --screw:#c5cbd0; --screwline:#68747e;
  --sch:#4a5561; --schon:#0b67a3; --slot:#2b333b; --lever:#3e4853; --leverink:#f4f6f7;
  --stator:#6a7783; --hub:#2f3841;
  --ok:#1b9a50; --live:#f0a00c; --warn:#c98100; --fault:#cf3523;
  --wirecase:rgba(18,26,34,.38);
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-tag:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --panel:#161e26; --panel2:#1d2731; --ink:#e2e9ee; --muted:#8c9aa8; --line:#27333e;
  --accent:#4eaaea; --accent-ink:#081521; --accent-soft:#16344b;
  --plate:#121a21; --dot:#25313b; --glass:rgba(22,30,38,.92);
  --dev:#2a333c; --devline:#55626e; --band:#0b1015; --bandink:#dde5ea;
  --screw:#7f8a94; --screwline:#b1bac2;
  --sch:#a9b5bf; --schon:#5ab6f2; --slot:#0d1216; --lever:#4b5763; --leverink:#eef2f4;
  --stator:#55626e; --hub:#11171d;
  --ok:#3cc277; --live:#ffb42a; --warn:#e3a12a; --fault:#f0574a;
  --wirecase:rgba(226,233,238,.32); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --panel:#161e26; --panel2:#1d2731; --ink:#e2e9ee; --muted:#8c9aa8; --line:#27333e;
  --accent:#4eaaea; --accent-ink:#081521; --accent-soft:#16344b;
  --plate:#121a21; --dot:#25313b; --glass:rgba(22,30,38,.92);
  --dev:#2a333c; --devline:#55626e; --band:#0b1015; --bandink:#dde5ea;
  --screw:#7f8a94; --screwline:#b1bac2;
  --sch:#a9b5bf; --schon:#5ab6f2; --slot:#0d1216; --lever:#4b5763; --leverink:#eef2f4;
  --stator:#55626e; --hub:#11171d;
  --ok:#3cc277; --live:#ffb42a; --warn:#e3a12a; --fault:#f0574a;
  --wirecase:rgba(226,233,238,.32); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);padding-inline:16px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;gap:10px;padding-block:12px;
  grid-template-columns:186px minmax(0,1fr) 272px;
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "lib stage insp" "lib drawer insp"}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0;min-height:0}

/* top bar */
.top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{display:flex;align-items:center;gap:8px;font:700 20px/1 var(--f-tag);letter-spacing:.02em;margin-right:6px}
.brand svg{width:28px;height:28px;flex:none}
.brand small{display:block;font:500 11px var(--f-ui);color:var(--muted);letter-spacing:.02em;margin-top:2px}
.grp{display:inline-flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px}
.sp{flex:1}
button{background:transparent;border:0;border-radius:5px;padding:6px 10px;cursor:pointer;font-weight:500;font-size:13px;line-height:1.2}
button:hover:not(:disabled){background:var(--panel2)}
button.on{background:var(--accent-soft);color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
.btn{border:1px solid var(--line);background:var(--panel)}
.run{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:7px 14px;border-radius:7px;display:inline-flex;align-items:center;gap:7px}
.run:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.run.stop{background:var(--fault);color:#fff}
.run i{width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.run.stop i{width:9px;height:9px;border:0;background:currentColor;border-radius:1px}
.sw{width:19px;height:19px;border-radius:50%;padding:0;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.sw.pe{background:repeating-linear-gradient(135deg,#3a9a3f 0 4px,#f2d01b 4px 8px)!important}
.lbl{font:600 11px var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 4px}
select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px}

/* library */
.lib{grid-area:lib;overflow:auto;padding:8px}
.lib h3{font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 6px 4px}
.lib .gr:first-child h3{margin-top:4px}
.items{display:flex;flex-direction:column;gap:1px}
.li{display:flex;width:100%;gap:9px;align-items:center;text-align:left;padding:6px;font-size:13.5px}
.code{font:600 10.5px/1 var(--f-mono);min-width:28px;text-align:center;padding:4px 0;border-radius:3px;background:var(--band);color:var(--bandink);flex:none}
.lib .hint{font-size:12px;color:var(--muted);margin:14px 6px 4px;line-height:1.4}

/* stage */
.stage{grid-area:stage;position:relative;overflow:hidden;background:var(--plate)}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
.stage.panning #cv{cursor:grabbing}
.banner{position:absolute;left:12px;right:60px;top:10px;padding:8px 12px;border-radius:6px;background:var(--fault);color:#fff;font-weight:600;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.banner.w{background:var(--warn)}
.status{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:16px;padding:6px 12px;font:12px/1.35 var(--f-mono);background:var(--glass);border-top:1px solid var(--line);flex-wrap:wrap}
.status b{font-weight:600;color:var(--accent)}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;padding:0;background:var(--glass);border:1px solid var(--line);font-size:16px;font-weight:600}
.modechip{position:absolute;left:12px;bottom:40px;font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:4px;background:var(--band);color:var(--bandink)}
.modechip.sim{background:var(--ok);color:#fff}

/* inspector */
.insp{grid-area:insp;overflow:auto;padding:14px 14px 18px}
.ih{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.itag{font:700 24px/1 var(--f-tag)}
.itype{color:var(--muted);font-size:13px}
.idesc{color:var(--muted);font-size:13px;margin:6px 0 14px;max-width:60ch}
.insp h4{font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.fld{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:8px;margin:6px 0}
.fld span{font-size:12.5px;color:var(--muted)}
.fld input,.fld select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:13px}
.tlist{list-style:none;margin:0;padding:0;font:12px var(--f-mono);display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.tlist .n{font-weight:600}
.tlist .v{color:var(--muted);overflow-wrap:anywhere}
.tlist .v.live{color:var(--warn)}
.state{font:12.5px var(--f-mono);padding:8px 10px;border-radius:6px;background:var(--panel2);border-left:3px solid var(--line)}
.state.on{border-left-color:var(--ok)}
.state.f{border-left-color:var(--fault)}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.danger{color:var(--fault)}
.help ol{padding-left:18px;margin:6px 0 12px;font-size:13px}
.help li{margin:5px 0}
.help p{font-size:13px;color:var(--muted);margin:6px 0}
.kbd{font:11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel2)}
.counts{display:flex;gap:16px;font-size:13px;margin-top:8px}
.counts b{font:700 20px var(--f-tag);display:block}

/* drawer */
.drawer{grid-area:drawer;height:290px;display:flex;flex-direction:column}
.drawer.col{height:auto}
.drawer.col #drb{display:none}
.tabs{display:flex;gap:2px;padding:5px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.drawer.col .tabs{border-bottom:0}
.tabs .cnt{font:11px var(--f-mono);color:var(--muted);margin-left:4px}
#drb{flex:1;overflow:auto;padding:10px 12px 14px;min-height:0}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.phelp{font-size:12.5px;color:var(--muted);margin:0 0 10px;max-width:90ch}
code{font:12px var(--f-mono);background:var(--panel2);padding:1px 4px;border-radius:3px}
.rung{border-top:1px solid var(--line);padding:8px 0 6px}
.rctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rno{font:600 12px var(--f-mono);color:var(--muted);width:30px}
.rctl input,.rctl select{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 7px;font-size:13px}
.rexpr{font-family:var(--f-mono)!important;flex:1 1 220px;min-width:160px}
.raddr{font-family:var(--f-mono)!important;width:72px}
.rpt{width:86px}
.rnote{flex:1 1 160px;min-width:120px;color:var(--muted)}
.rctl .ib{padding:4px 7px;color:var(--muted)}
.rlad{overflow-x:auto;padding:4px 0 0}
.lerr{font:12px var(--f-mono);color:var(--fault);padding:6px 0 4px 34px}
.empty{color:var(--muted);font-size:13px;padding:12px 2px}

svg.lad{display:block;margin-left:30px}
.lad .rail{stroke:var(--ink);stroke-width:3}
.lad .rail.p,.lad .lw.p{stroke:var(--ok)}
.lad .lw{stroke:var(--sch);stroke-width:1.6;fill:none}
.lad .lw.p{stroke-width:2.6}
.lad .lc{stroke:var(--sch);stroke-width:2.2}
.lad .lc.on{stroke:var(--ok);stroke-width:3}
.lad .lco{fill:none;stroke:var(--sch);stroke-width:2}
.lad .lco.on{stroke:var(--ok);stroke-width:3}
.lad .la{font:500 11px var(--f-mono);fill:var(--ink)}
.lad .ls{font:500 10.5px var(--f-tag);fill:var(--muted)}
.lad .tb{fill:var(--panel2);stroke:var(--sch);stroke-width:1.4}
.lad .tb.on{stroke:var(--ok);stroke-width:2.4}
.lad .tt{font:500 10.5px var(--f-mono);fill:var(--ink)}
.lad .bar{fill:var(--ok)}

.io{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 20px}
.io h5{font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.iorow{display:flex;justify-content:space-between;gap:8px;font:12.5px var(--f-mono);padding:3px 8px;border-radius:4px;margin:2px 0;background:var(--panel2)}
.iorow.on{background:var(--ok);color:#fff}
.iorow .s{opacity:.75;font-family:var(--f-tag);font-size:13px}
.pstat{font:12.5px var(--f-mono);margin-bottom:10px}
.log{list-style:none;margin:0;padding:0;font:12.5px var(--f-mono)}
.log li{display:flex;gap:12px;padding:3px 0;border-bottom:1px dashed var(--line)}
.log .t{color:var(--muted);min-width:70px;text-align:right}
.log .f{color:var(--fault)}
.log .w{color:var(--warn)}

/* svg devices */
:is(#cv,.lay) .body{fill:var(--dev);stroke:var(--devline);stroke-width:1}
:is(#cv,.lay) .comp.sel .body{stroke:var(--accent);stroke-width:2.2}
:is(#cv,.lay) .band{fill:var(--band)}
:is(#cv,.lay) .btag{fill:var(--bandink);font:700 12.5px var(--f-tag);letter-spacing:.03em}
:is(#cv,.lay) .bsub{fill:var(--bandink);opacity:.72;font:500 10.5px var(--f-tag);letter-spacing:.02em}
:is(#cv,.lay) .bsub.f{fill:#ff8a7e;opacity:1}
:is(#cv,.lay) .tl{fill:var(--muted);font:500 8.5px var(--f-mono)}
:is(#cv,.lay) .tscrew{fill:var(--screw);stroke:var(--screwline);stroke-width:1}
:is(#cv,.lay) .slt{stroke:var(--screwline);stroke-width:1.1}
:is(#cv,.lay) .thit{fill:transparent}
:is(#cv,.lay) .term{cursor:crosshair}
:is(#cv,.lay) .term:hover .tscrew,:is(#cv,.lay) .term.pa .tscrew{fill:var(--accent);stroke:var(--accent)}
:is(#cv,.lay) .term.pb .tscrew{fill:var(--ink)}
:is(#cv,.lay) .sch{stroke:var(--sch);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
:is(#cv,.lay) .sch.on{stroke:var(--schon);stroke-width:1.9}
:is(#cv,.lay) .mech{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
:is(#cv,.lay) .coil{fill:var(--dev);stroke:var(--sch);stroke-width:1.5}
:is(#cv,.lay) .coil.on{fill:var(--schon);stroke:var(--schon)}
:is(#cv,.lay) .big{fill:var(--ink);font:600 14px var(--f-tag);letter-spacing:.02em}
:is(#cv,.lay) .tiny{fill:var(--muted);font:500 9.5px var(--f-tag);letter-spacing:.03em}
:is(#cv,.lay) .leg{fill:var(--ink);font:700 10px var(--f-tag);letter-spacing:.06em}
:is(#cv,.lay) .leg.f{fill:var(--fault)}
:is(#cv,.lay) .slot{fill:var(--slot)}
:is(#cv,.lay) .lever{fill:var(--lever)}
:is(#cv,.lay) .lvt{fill:var(--leverink);font:700 10px var(--f-tag);letter-spacing:.04em}
:is(#cv,.lay) .trip{fill:var(--fault);font:700 9.5px var(--f-tag);letter-spacing:.06em}
:is(#cv,.lay) .win.r{fill:var(--fault)} :is(#cv,.lay) .win.g{fill:var(--ok)}
:is(#cv,.lay) .led{fill:var(--devline);opacity:.55}
:is(#cv,.lay) .led.g{fill:var(--ok);opacity:1} :is(#cv,.lay) .led.a{fill:var(--live);opacity:1} :is(#cv,.lay) .led.r{fill:var(--fault);opacity:1}
:is(#cv,.lay) .bezel{fill:var(--slot);stroke:var(--devline)}
:is(#cv,.lay) .face{stroke:rgba(0,0,0,.35);stroke-width:1}
:is(#cv,.lay) .face.p{stroke:rgba(0,0,0,.6);stroke-width:3}
:is(#cv,.lay) .lens{opacity:.26;stroke:rgba(0,0,0,.35)}
:is(#cv,.lay) .lens.on{opacity:1}
:is(#cv,.lay) .glow{opacity:.55}
:is(#cv,.lay) .ering{fill:#f2c80f;stroke:#9b8008}
:is(#cv,.lay) .emush{fill:#d42a1f;stroke:#7c140e;stroke-width:1.2}
:is(#cv,.lay) .emush.p{stroke-width:3.5}
:is(#cv,.lay) .knob{fill:var(--slot)}
:is(#cv,.lay) .kbar{fill:var(--leverink)}
:is(#cv,.lay) .arm{stroke:var(--lever);stroke-width:4;stroke-linecap:round}
:is(#cv,.lay) .roller{fill:var(--screw);stroke:var(--lever);stroke-width:2}
:is(#cv,.lay) .pbtn{fill:var(--lever)} :is(#cv,.lay) .pbtn.b{fill:var(--accent)}
:is(#cv,.lay) .pbt{fill:#fff;font:700 8px var(--f-tag);letter-spacing:.05em}
:is(#cv,.lay) .prog{fill:var(--ok)}
:is(#cv,.lay) .stator{fill:var(--stator);stroke:var(--devline)}
:is(#cv,.lay) .blade{stroke:var(--leverink);stroke-width:5;stroke-linecap:round;opacity:.8}
:is(#cv,.lay) .hub{fill:var(--hub)}
:is(#cv,.lay) .mt{fill:var(--leverink);font:700 13px var(--f-tag);text-anchor:middle}
:is(#cv,.lay) .mt.s{font-size:10px}
:is(#cv,.lay) .ms{font:700 10.5px var(--f-tag);letter-spacing:.06em;text-anchor:middle;fill:var(--muted)}
:is(#cv,.lay) .ms.ok{fill:var(--ok)} :is(#cv,.lay) .ms.f{fill:var(--fault)}
:is(#cv,.lay) .warnt{fill:var(--fault);font:700 9.5px var(--f-tag);letter-spacing:.05em}
:is(#cv,.lay) .actg{cursor:inherit}
.simmode :is(#cv,.lay) .actg{cursor:pointer}
:is(#cv,.lay) .wcase{stroke:var(--wirecase);stroke-width:5.2;fill:none;stroke-linejoin:round}
:is(#cv,.lay) .wcore{stroke-width:3;fill:none;stroke-linejoin:round}
:is(#cv,.lay) .wlive{stroke:var(--live);stroke-width:1.5;fill:none;stroke-dasharray:4 8;stroke-linejoin:round}
:is(#cv,.lay) .whit{stroke:transparent;stroke-width:12;fill:none;cursor:pointer}
:is(#cv,.lay) .wire.sel .wcase{stroke:var(--accent);stroke-width:9;opacity:.55}
:is(#cv,.lay) .wire.flt .wcase{stroke:var(--fault);stroke-width:9;opacity:.8}
:is(#cv,.lay) .pend{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;fill:none}
:is(#cv,.lay) .gridbg{fill:url(#pg)}
:is(#cv,.lay) .pdot{fill:var(--dot)}

:is(#cv,.lay) .tankb{fill:var(--panel2);stroke:var(--devline);stroke-width:1.5}
:is(#cv,.lay) .water{fill:#3d8fd6;opacity:.85}
:is(#cv,.lay) .water.p{fill:#d9822b}
:is(#cv,.lay) .water.t{fill:#d4523c}
:is(#cv,.lay) .spm{stroke:var(--fault);stroke-width:1.5}
:is(#cv,.lay) .valve{fill:var(--dev);stroke:var(--sch);stroke-width:1.5}
:is(#cv,.lay) .valve.on{fill:var(--ok)}
:is(#cv,.lay) .scr{fill:#0c1924;stroke:var(--devline)}
:is(#cv,.lay) .scrt{fill:#cfe6f5;font:500 10px var(--f-mono)}
:is(#cv,.lay) .scrt.a{fill:#ff8a7e}
:is(#cv,.lay) .scrt.d{fill:#5f7584}
:is(#cv,.lay) .dial{fill:var(--panel2);stroke:var(--devline);stroke-width:1.5}
:is(#cv,.lay) .needle{stroke:var(--fault);stroke-width:2.2;stroke-linecap:round}
:is(#cv,.lay) .addr{fill:var(--muted);font:500 7.5px var(--f-mono)}
:is(#cv,.lay) .rbox{fill:var(--panel2);stroke:var(--devline)}
:is(#cv,.lay) .rbox.on{fill:var(--schon);stroke:var(--schon)}
:is(#cv,.lay) .seg{stroke:rgba(0,0,0,.35);stroke-width:1}
:is(#cv,.lay) .stem{fill:var(--screw);stroke:var(--screwline)}
:is(#cv,.lay) .rdo{fill:var(--ink);font:600 11px var(--f-mono)}
:is(#cv,.lay) .rdo.s{font-size:9.5px;font-weight:500;fill:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
.pgrid .fld input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 8px}
.secs{border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 18px;margin:0}
.secs legend{font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.secs label{display:flex;gap:6px;align-items:center;font-size:13px}
.pstatus{min-height:1.4em;font-size:13px}
.pstatus.err{color:var(--fault)}
.io .sub{font:11px var(--f-mono);color:var(--muted);margin:-2px 0 6px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,16,22,.45);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(640px,100%);padding:18px;display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:0;font:700 20px var(--f-tag)}
.sheet p{margin:0;color:var(--muted);font-size:13px}
.sheet textarea{width:100%;height:280px;font:12px/1.4 var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mrow input[type=file]{font-size:12px;flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--band);color:var(--bandink);padding:8px 14px;border-radius:6px;font-size:13px;z-index:11;max-width:calc(100% - 32px)}

/* ---------- panel layout & BOQ ---------- */
:root{--encl:#d3d8dc;--encl-line:#76828c;--zinc:#c4cacf;--rail:#eceff1;--railline:#8b959e;--duct:#a9afb5;--ductline:#6c757d;--door:#d9dee2;--dim:#0b67a3;--ldev:#f6f6f2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--encl:#232c34;--encl-line:#5a6772;--zinc:#2e3841;--rail:#56626d;--railline:#8995a1;--duct:#47515b;--ductline:#7a8691;--door:#27313a;--dim:#4eaaea;--ldev:#3a444d}}
:root[data-theme="dark"]{--encl:#232c34;--encl-line:#5a6772;--zinc:#2e3841;--rail:#56626d;--railline:#8995a1;--duct:#47515b;--ductline:#7a8691;--door:#27313a;--dim:#4eaaea;--ldev:#3a444d}
#lv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.app.v-layout #cv,.app.v-site #cv{display:none}
.app:not(.v-layout) #lv,.app:not(.v-layout) .facesw{display:none}
.app:not(.v-site) #sv{display:none}
#sv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
:root{--tray-p:#d2722b;--tray-s:#2f7de1;--tray-c:#7a8691;--tray-m:#8e6cc4;--site:#eef1f3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tray-p:#e08a45;--tray-s:#5aa2f0;--tray-c:#8d99a4;--tray-m:#a98be0;--site:#141b22}}
:root[data-theme="dark"]{--tray-p:#e08a45;--tray-s:#5aa2f0;--tray-c:#8d99a4;--tray-m:#a98be0;--site:#141b22}
.site .sgbg{pointer-events:none}.site .sg{stroke:var(--line);stroke-width:.02;fill:none}
.site .shit{stroke:transparent;stroke-width:.6;cursor:move}
.site .sbody{opacity:.55;stroke-linecap:butt;pointer-events:none}.site .sbody.conduit{opacity:.9;stroke-dasharray:.25 .12}
.site .score{stroke:var(--ink);stroke-width:.015;opacity:.5;pointer-events:none}
.site .srun.sel .sbody{opacity:.9}
.site .stx{fill:var(--ink);font:600 .2px var(--f-mono);pointer-events:none}
.site .shd{fill:var(--accent);stroke:#fff;stroke-width:.04;cursor:grab}
.site .sdrop{stroke:var(--muted);stroke-width:.03;stroke-dasharray:.12 .08;fill:none;pointer-events:none}
.site .sdrop.free{stroke:var(--warn);stroke-width:.04}
.site .sroute{stroke:var(--accent);stroke-width:.12;fill:none;opacity:.75;stroke-linejoin:round;pointer-events:none}
.site .spb{fill:var(--dev);stroke:var(--ink);stroke-width:.03;cursor:move}
.site .spanel.sel .spb{stroke:var(--accent);stroke-width:.06}
.site .sgl{fill:var(--ink)}
.site .sdev{cursor:move}.simmode .site .sdev{cursor:pointer}
.site .sdb{stroke:var(--ink);stroke-width:.03}
.site .sdev.sel .sdb{stroke:var(--accent);stroke-width:.09}
.site .sdev.bad .sdb{stroke:var(--fault);stroke-width:.08}
.site .son{fill:var(--ok);opacity:.45}
.site .stag{fill:var(--ink);font:700 .28px var(--f-tag);pointer-events:none}
.site .ssub{fill:var(--muted);font:500 .2px var(--f-tag);pointer-events:none}
.site .sico{fill:#fff;font:700 .24px var(--f-tag);pointer-events:none}
.facesw{position:absolute;left:12px;top:10px;background:var(--glass)}
.app.v-layout .banner{top:52px}
.lay .encl{fill:var(--encl);stroke:var(--encl-line);stroke-width:1.2}
.lay .plate{fill:var(--zinc);stroke:var(--encl-line);stroke-width:.6}
.lay .doorf{fill:var(--door);stroke:var(--encl-line);stroke-width:.8}
.lay .hinge{fill:var(--encl-line)}
.lay .rl{fill:var(--rail);stroke:var(--railline);stroke-width:.5;cursor:move}
.lay .rs{fill:var(--railline);opacity:.55;pointer-events:none}
.lay .dc{fill:var(--duct);stroke:var(--ductline);stroke-width:.5;cursor:move}
.lay .dc.w{fill:#d6a23e}.lay .dc.f{fill:#d4523c}
.lay .df{stroke:var(--ductline);stroke-width:.45;pointer-events:none}
.lay .dpct{fill:var(--ink);font:600 7px var(--f-mono);pointer-events:none}
.lay .sel>.rl,.lay .sel>.dc{stroke:var(--accent);stroke-width:1.6}
.lay .ld{cursor:move}
.simmode .lay .ld{cursor:default}
.simmode .lay .ld [data-act]{cursor:pointer}
.lay .lb{fill:var(--ldev);stroke:var(--devline);stroke-width:.5}
.lay .ld.sel .lb{stroke:var(--accent);stroke-width:1.6}
.lay .ld.bad .lb{stroke:var(--fault);stroke-width:1.3;stroke-dasharray:3 2}
.lay .ltm{fill:var(--screw);stroke:var(--screwline);stroke-width:.3}
.lay .ltag{fill:var(--ink);font:700 6px var(--f-tag);letter-spacing:.02em;pointer-events:none}
.lay .lsub{fill:var(--muted);font:500 4px var(--f-tag);pointer-events:none}
.lay .lwin{fill:var(--panel2);stroke:var(--devline);stroke-width:.4}
.lay .lwin.on{fill:var(--schon)}
.lay .llev{fill:var(--lever)}
.lay .llvt{fill:var(--leverink);font:700 5px var(--f-tag)}
.lay .lled{fill:var(--devline);opacity:.5}
.lay .lled.g{fill:var(--ok);opacity:1}.lay .lled.a{fill:var(--live);opacity:1}.lay .lled.r{fill:var(--fault);opacity:1}
.lay .lplate{fill:#f4f4ee;stroke:var(--devline);stroke-width:.4}
.lay .lplt{fill:#15202b;font:700 5px var(--f-tag);letter-spacing:.04em}
.lay .tbN{fill:#4c8fe0}.lay .tbPE{fill:#3a9a3f}.lay .tbG{fill:#9aa2a8}
.lay .dimt{fill:var(--dim);font:600 12px var(--f-mono)}
.lay .diml{stroke:var(--dim);stroke-width:.7;fill:none}
.lay .cap{fill:var(--muted);font:600 11px var(--f-ui);letter-spacing:.06em}
.lay .hd{fill:var(--accent);cursor:ew-resize}
.lay .hd.v{cursor:ns-resize}
.lay .ghost{fill:none;stroke:var(--muted);stroke-width:.6;stroke-dasharray:4 3}
.lay .gtx{fill:var(--muted);font:500 5px var(--f-tag)}
.lib .li.muted{color:var(--muted)}
.lib .lsum{font-size:12.5px;color:var(--muted);margin:2px 6px 6px;line-height:1.45}
.lib .lsum b{color:var(--ink);font-weight:600}
.lib .btnrow{display:flex;flex-wrap:wrap;gap:6px;margin:4px 6px}
.chk{list-style:none;margin:0;padding:0;font-size:12.5px}
.chk li{padding:5px 8px;border-left:3px solid var(--line);background:var(--panel2);border-radius:4px;margin:4px 0;cursor:pointer}
.chk li.err{border-left-color:var(--fault)}.chk li.warn{border-left-color:var(--warn)}.chk li.ok{border-left-color:var(--ok);cursor:default}
.stats{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.stats span:nth-child(odd){color:var(--muted)}
.stats .f{color:var(--fault);font-weight:600}.stats .w{color:var(--warn);font-weight:600}
.fld3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.fld3 label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted)}
.fld3 input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px 6px;font-size:13px;color:var(--ink)}
.boqv{grid-area:boq;overflow:auto;padding:14px 16px 24px}
.app:not(.v-boq) .boqv{display:none}
.app.v-boq{grid-template-areas:"top top top" "boq boq boq" "boq boq boq"}
.app.v-boq .lib,.app.v-boq .insp,.app.v-boq .stage,.app.v-boq .drawer{display:none}
.bhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.bhead h2{margin:0;font:700 24px var(--f-tag)}
.bhead .meta{color:var(--muted);font-size:13px}
.bopts{display:flex;flex-wrap:wrap;gap:8px 14px;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel2)}
.bopts label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.bopts input{width:72px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-size:13px;color:var(--ink)}
.bcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.bcard{border:1px solid var(--line);border-radius:7px;padding:10px 12px;background:var(--panel)}
.bcard b{display:block;font:700 22px var(--f-tag)}
.bcard span{font-size:12px;color:var(--muted)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:7px}
table.boq{border-collapse:collapse;width:100%;min-width:980px;font-size:13px}
.boq th{position:sticky;top:0;background:var(--band);color:var(--bandink);font:600 11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:7px 8px}
.boq td{padding:5px 8px;border-top:1px solid var(--line);vertical-align:middle}
.boq tr.cat td{background:var(--panel2);font:600 11.5px var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.boq td.n{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.boq td.tg{font:12px var(--f-mono);color:var(--muted);max-width:220px;overflow-wrap:anywhere}
.boq td.sp{color:var(--muted);font-size:12.5px;max-width:300px}
.boq input{width:100%;min-width:70px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:4px 6px;font-size:12.5px;color:var(--ink)}
.boq input.pr{text-align:right;font-family:var(--f-mono);width:100px}
.boq tfoot td{font-weight:600;border-top:2px solid var(--line)}
.boq tfoot tr.g td{font:700 16px var(--f-tag)}
.bnote{font-size:12.5px;color:var(--muted);margin:10px 2px 0;max-width:110ch}

@media (max-width:980px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"top" "stage" "lib" "drawer" "insp"}
  .stage{height:64vh;min-height:380px}
  .lib{max-height:none}
  .items{flex-direction:row;flex-wrap:wrap;gap:4px}
  .li{width:auto;border:1px solid var(--line);padding:5px 8px}
  .lib .hint{display:none}
  .drawer{height:auto;max-height:none}
  #drb{max-height:420px}
  .app.v-boq{grid-template-areas:"top" "boq"}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="5" fill="var(--band)"/><rect x="6" y="9" width="7" height="10" fill="none" stroke="var(--bandink)" stroke-width="1.8"/><path d="M19 5v6M19 23v-6l-4-5" fill="none" stroke="var(--live)" stroke-width="2" stroke-linecap="round"/></svg>
      <div>Panel Bench<small>Control panel wiring &amp; PLC simulator</small></div>
    </div>
    <div class="grp views" role="tablist" aria-label="View">
      <button data-view="wiring" class="on" title="Schematic wiring, PLC logic and simulation (1)">Wiring &amp; logic</button>
      <button data-view="layout" title="Enclosure, mounting plate, DIN rails, ducts and door (2)">Panel layout</button>
      <button data-view="site" title="Site plan: cable trays, conduits and field cables (3)">Site &amp; cables</button>
      <button data-view="boq" title="Bill of quantities for purchasing (4)">BOQ</button>
    </div>
    <button class="run" id="run"><i></i><span>Simulate</span></button>
    <div class="grp" role="group" aria-label="Tools">
      <button id="t-select" class="on" title="Select, move and wire (S)">Select &amp; wire</button>
      <button id="t-delete" title="Delete parts or wires (D)">Delete</button>
      <button id="t-probe" title="Measure voltage between two terminals while simulating (P)">Probe</button>
    </div>
    <div class="grp" role="group" aria-label="Wire colour"><span class="lbl">Wire</span><span id="swatches" style="display:flex;gap:5px;padding:0 4px"></span><select id="wsize" aria-label="Wire size for new wires" title="Conductor size for new wires" style="border:0;padding:3px 4px"></select></div>
    <span class="sp"></span>
    <select id="ex" aria-label="Load example">
      <option value="">Load example…</option>
      <option value="boiler">Boiler feed water &amp; pressure (PLC)</option>
      <option value="safety">Boiler panel supply &amp; e-stop chain</option>
      <option value="dol">DOL motor starter (hard-wired)</option>
      <option value="plc">PLC start/stop + on-delay</option>
      <option value="blank">Blank plate</option>
    </select>
    <div class="grp">
      <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
      <button id="imp">Import</button>
      <button id="exp">Export</button>
      <button id="pdf" style="font-weight:600;color:var(--accent)">PDF</button>
      <button id="clr" class="danger">Clear</button>
    </div>
  </header>

  <aside class="panel lib" id="lib" aria-label="Parts library"></aside>

  <main class="panel stage" id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="pg" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1.15" class="pdot"/><circle cx="20" cy="0" r="1.15" class="pdot"/><circle cx="0" cy="20" r="1.15" class="pdot"/><circle cx="20" cy="20" r="1.15" class="pdot"/></pattern>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>
      <rect class="gridbg" x="-5000" y="-5000" width="10000" height="10000"/>
      <g id="world"></g>
    </svg>
    <svg id="lv" class="lay" xmlns="http://www.w3.org/2000/svg"></svg>
    <svg id="sv" class="site" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="facesw grp" id="facesw" role="group" aria-label="Face"><button data-face="plate" class="on">Mounting plate</button><button data-face="door">Door</button></div>
    <div class="banner" id="banner" hidden></div>
    <div class="zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zfit" title="Fit to parts" style="font-size:11px">FIT</button></div>
    <div class="modechip" id="modechip">Edit</div>
    <div class="status"><span id="st-l"></span><span id="st-r"></span></div>
  </main>

  <aside class="panel insp" id="insp" aria-label="Inspector"></aside>

  <section class="panel boqv" id="boqv" aria-label="Bill of quantities"></section>

  <section class="panel drawer" id="drawer">
    <div class="tabs">
      <button data-tab="prog" class="on">PLC program</button>
      <button data-tab="io">I/O monitor</button>
      <button data-tab="cables">Cable schedule</button>
      <button data-tab="log">Events<span class="cnt" id="logn"></span></button>
      <span class="sp"></span>
      <button id="drt" title="Collapse panel">Collapse</button>
    </div>
    <div id="drb"></div>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h3 id="m-title">Export</h3>
    <p id="m-note"></p>
    <textarea id="m-text" spellcheck="false" aria-label="Project JSON"></textarea>
    <div class="mrow">
      <input type="file" id="m-file" accept=".json,application/json">
      <span class="sp"></span>
      <button class="btn" id="m-copy">Copy</button>
      <button class="btn" id="m-save">Save .json</button>
      <button class="run" id="m-load">Load project</button>
      <button class="btn" id="m-close">Close</button>
    </div>
  </div>
</div>
<div class="modal" id="pdfm" hidden>
  <form class="sheet" id="pdf-form" role="dialog" aria-modal="true" aria-labelledby="pdf-title">
    <h3 id="pdf-title">Export drawing set as PDF</h3>
    <p>A3 landscape sheets with a title block. The wiring sheet shows the plate as it is now, including live states if the simulation is running.</p>
    <div class="pgrid">
      <label class="fld"><span>Company</span><input id="pi-company" maxlength="60"></label>
      <label class="fld"><span>Project</span><input id="pi-project" maxlength="60"></label>
      <label class="fld"><span>Drawing no.</span><input id="pi-dwg" maxlength="30"></label>
      <label class="fld"><span>Revision</span><input id="pi-rev" maxlength="6"></label>
      <label class="fld"><span>Drawn by</span><input id="pi-drawn" maxlength="30"></label>
      <label class="fld"><span>Checked by</span><input id="pi-checked" maxlength="30"></label>
    </div>
    <fieldset class="secs"><legend>Sheets</legend>
      <label><input type="checkbox" id="ps-layout" checked> Wiring layout</label>
      <label><input type="checkbox" id="ps-prog" checked> PLC program</label>
      <label><input type="checkbox" id="ps-io" checked> I/O list</label>
      <label><input type="checkbox" id="ps-bom" checked> Parts list</label>
      <label><input type="checkbox" id="ps-wires" checked> Wire list</label>
      <label><input type="checkbox" id="ps-panel" checked> Panel layout (plate + door)</label>
      <label><input type="checkbox" id="ps-site" checked> Site cable plan</label>
      <label><input type="checkbox" id="ps-cables" checked> Cable schedule</label>
      <label><input type="checkbox" id="ps-boq" checked> BOQ</label>
    </fieldset>
    <p id="pdf-status" class="pstatus" aria-live="polite"></p>
    <div class="mrow"><span class="sp"></span><button type="button" class="btn" id="pdf-close">Close</button><button type="submit" class="run" id="pdf-go">Create PDF</button></div>
  </form>
</div>
<div id="offscreen" aria-hidden="true" style="position:fixed;left:-20000px;top:0;width:4000px;pointer-events:none"></div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const SNAP=10, snap=v=>Math.round(v/SNAP)*SNAP;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const AC=new Set(['L1','L2','L3','N']), PH=['L1','L2','L3'], LIVE=new Set(['L1','L2','L3','+24']);
const WIRES=[
  {id:'brown',hex:'#7b4a26',name:'Brown · L1 / phase'},
  {id:'black',hex:'#1d2023',name:'Black · L2'},
  {id:'grey',hex:'#8a9096',name:'Grey · L3'},
  {id:'blue',hex:'#4c8fe0',name:'Light blue · N'},
  {id:'pe',hex:'#3a9a3f',name:'Green/yellow · PE'},
  {id:'red',hex:'#c8312a',name:'Red · AC control'},
  {id:'navy',hex:'#1f3f94',name:'Dark blue · DC control'},
  {id:'white',hex:'#e6e6e0',name:'White · DC 0 V'},
  {id:'orange',hex:'#e27a18',name:'Orange · external interlock'},
];
const WC=Object.fromEntries(WIRES.map(c=>[c.id,c]));
const LAMP={green:'#25b24f',red:'#e2402f',amber:'#f4a50c',white:'#f3efe2',blue:'#2f7de1'};
const BTN={green:'#2a9a4a',red:'#cf3328',black:'#2a2e33',blue:'#2c6bc9',white:'#ecebe6'};

/* ---------- schematic drawing helpers ---------- */
const L=(x1,y1,x2,y2,c='sch')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/>`;
function contact(x,y0,y1,closed,nc){
  const m=(y0+y1)/2,a=m-8,b=m+8,o=closed?'sch on':'sch';
  let s=L(x,y0,x,a,o)+L(x,b,x,y1,o);
  s+=closed?L(x,b,x,a,o):L(x,b,x-9,a+2,'sch');
  if(nc) s+=L(x,a,x+6,a,o);
  return s;
}
function coil(x,y0,y1,on){const m=(y0+y1)/2;return L(x,y0,x,m-9)+L(x,m+9,x,y1)+`<rect x="${x-8}" y="${m-9}" width="16" height="18" class="coil${on?' on':''}"/>`;}
function co(xc,xa,xb,y0,y1,toB){const m=(y0+y1)/2;return L(xc,y0,xc,m-8,'sch on')+L(xa,m+8,xa,y1,toB?'sch':'sch on')+L(xb,m+8,xb,y1,toB?'sch on':'sch')+L(xc,m-8,toB?xb:xa,m+8,'sch on');}
function thermal(x,y0,y1){const m=(y0+y1)/2;return L(x,y0,x,m-10)+`<path d="M${x} ${m-10}v5h-6v8h12v8h-6v-1" class="sch"/>`+L(x,m+10,x,y1);}
const mech=(x1,x2,y)=>`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" class="mech"/>`;
const led=(x,y,cls,txt)=>`<circle cx="${x}" cy="${y}" r="4.2" class="led ${cls||''}"/>`+(txt?`<text x="${x+8}" y="${y+3.3}" class="tiny">${txt}</text>`:'');
const Y0=40;

function set(c,k,v){if(c.st[k]!==v){c.st[k]=v;return true}return false}
function en(a,b,req){
  if(!a||!b||a===b) return false;
  const aa=AC.has(a),ab=AC.has(b);
  if(aa!==ab) return false;

function procByTag(tag){return tag?S.comps.find(c=>c.type==='proc'&&c.tag===String(tag).trim()):null}
function pvVal(tag){const p=procByTag(tag);if(!p) return null;return sim.running&&p.st.v!=null?p.st.v:+p.props.init}
function pvFmt(p,v){const span=Math.abs(+p.props.hi-+p.props.lo);return v==null||!isFinite(v)?'—':(+v).toFixed(span>40?0:1)}
function isActive(c){
  const st=c.st;
  switch(c.type){
    case 'contactor':case 'relay':return !!st.k;
    case 'motor':return st.m==='fwd'||st.m==='rev';
    case 'lamp':case 'sol':case 'siren':case 'fan1':return !!st.on;

}

function cpuOf(m){const ps=S.comps.filter(c=>c.type==='plc');const t=String(m.props.cpu||'').trim();return t?ps.find(p=>p.tag===t)||null:ps[0]||null}

function mAof(p,v){const lo=+p.props.lo,hi=+p.props.hi;return clamp(4+16*(v-lo)/((hi-lo)||1),3.8,20.5)}

function initSt(c){
  switch(c.type){
    case 'mcb1':case 'mcb3':return {on:true,tr:false};
    case 'fuse':return {ok:true,out:false};
    case 'plc':return {run:true,pw:false,X:{},Y:{},M:{},T:{},AI:{}};
    case 'motor':return {m:'off',ang:0};
    case 'proc':return {v:+c.props.init};
    case 'rpl16':return {k:Array(16).fill(false)};
    case 'lsw':return {s:[false,false,false]};
    case 'di16':return {on:[]};
    default:return {};
  }
}

const nid=p=>p+(S.seq++);
function splitKey(k){const i=k.indexOf(':');return [k.slice(0,i),k.slice(i+1)]}
function tname(k){const [cid,t]=splitKey(k);const c=byId(cid);return c?`${c.tag}:${t}`:k}
function tp(k){
  const [cid,t]=splitKey(k);const c=byId(cid);if(!c) return null;const ty=T[c.type],m=ty.tm[t];if(!m) return null;
  return {x:c.x+m.x,y:c.y+(m.s==='t'?0:ty.h),side:m.s};
}

/* ---------- electrical solver ---------- */
function buildNets(){
  const P=new Map();
  const f=k=>{let p=P.get(k);if(p===undefined){P.set(k,k);return k}if(p===k) return k;const r=f(p);P.set(k,r);return r};
  const u=(a,b)=>{const ra=f(a),rb=f(b);if(ra!==rb) P.set(ra,rb)};
  for(const w of S.wires) u(w.a,w.b);
  for(const c of S.comps) for(const [a,b] of T[c.type].cond(c)) u(c.id+':'+a,c.id+':'+b);
  const G=new Map();
  for(const c of S.comps) for(const [tn,g] of T[c.type].src(c)){const r=f(c.id+':'+tn);if(!G.has(r)) G.set(r,new Set());G.get(r).add(g)}
  let short=null;
  for(const [r,s] of G) if(s.size>1){short={root:r,groups:[...s]};break}
  return {f,G,short,gk:k=>{const s=G.get(f(k));return s&&s.size===1?[...s][0]:null},g(cid,tn){return this.gk(cid+':'+tn)}};
}
function evalAll(n){
  let ch=false;
  for(const c of S.comps){const t=T[c.type];if(t.ev&&t.ev(c,tn=>n?n.g(c.id,tn):null,n)) ch=true}
  return ch;
}
const PROT={fuse:0,mcb1:1,mcb3:2};
function protOn(c){return c.type==='fuse'?c.st.ok&&!c.st.out:c.st.on}
function solve(){
  sim.fault=null;sim.warn=null;
  for(let it=0;it<40;it++){
    const n=buildNets();
    if(n.short){
      let fixed=false;
      const prot=S.comps.filter(c=>c.type in PROT&&protOn(c)).sort((a,b)=>PROT[a.type]-PROT[b.type]);
      for(const c of prot){
        const key=c.type==='fuse'?'ok':'on';c.st[key]=false;
        if(!buildNets().short){if(c.type==='fuse') log(`${c.tag} blew: short circuit ${n.short.groups.join(' – ')}`,'f');else{c.st.tr=true;log(`${c.tag} tripped: short circuit ${n.short.groups.join(' – ')}`,'f')}fixed=true;break}
        c.st[key]=true;
      }
      if(fixed) continue;
      if(n.short.groups.some(g=>g==='+24'||g==='0V')){
        const ps=S.comps.filter(c=>c.type==='psu'&&c.st.pw&&!(c.st.ol>0));
        if(ps.length){ps.forEach(c=>{c.st.ol=1.5;log(`${c.tag} output shut down: short circuit on 24 V DC`,'f')});continue}
      }
      const fw=new Set(S.wires.filter(w=>n.f(w.a)===n.short.root).map(w=>w.id));
      sim.fault={groups:n.short.groups,wires:fw};
      const key=n.short.groups.join('|')+[...fw].join(',');
      if(sim.faultKey!==key){sim.faultKey=key;log(`Short circuit ${n.short.groups.join(' – ')} with nothing upstream to clear it`,'f')}
      evalAll(null);
      return n;
    }
    sim.faultKey='';
    if(!evalAll(n)) return n;
  }
  sim.warn='The circuit does not settle: contacts keep switching (relay chatter).';
  return buildNets();
}

/* ---------- PLC language ---------- */
const CC=new Map();
const RX={X:/^X[0-9]\.(1[0-5]|[0-9])$/,Y:/^Y[0-9]\.(1[0-5]|[0-9])$/,M:/^M\d{1,4}$/,T:/^T\d{1,3}$/,AI:/^AI[1-9]\.[1-4]$/};
function validAddr(w){return RX.X.test(w)||RX.Y.test(w)||RX.M.test(w)||RX.T.test(w)||RX.AI.test(w)}
const ADDR_HELP='Use X0.0–X9.15, Y0.0–Y9.15, M0…, T0… or AI1.1 compared with a number';
function parse(src){
  const s=String(src||'').toUpperCase();const raw=[];let i=0;
  while(i<s.length){
    const ch=s[i],two=s.slice(i,i+2);
    if(/\s/.test(ch)){i++;continue}
    if(ch==='('||ch===')'){raw.push(ch);i++;continue}
    if(['<=','>=','<>','=='].includes(two)){raw.push({op:two==='=='?'=':two});i+=2;continue}
    if(ch==='<'||ch==='>'||ch==='='){raw.push({op:ch});i++;continue}
    if(ch==='&'||ch==='*'){raw.push('&');i+=s[i+1]==='&'?2:1;continue}
    if(ch==='|'||ch==='+'||ch===','){raw.push('|');i+=s[i+1]==='|'?2:1;continue}
    if(ch==='!'||ch==='~'||ch==='/'){raw.push('!');i++;continue}
    const nm=/^-?\d+(\.\d+)?/.exec(s.slice(i));
    if(nm&&(ch!=='-'||(raw.length&&raw[raw.length-1].op))){raw.push({n:+nm[0]});i+=nm[0].length;continue}
    const m=/^[A-Z][A-Z0-9.]*/.exec(s.slice(i));
    if(!m) throw Error(`Unexpected character "${ch}"`);
    const w=m[0];i+=w.length;
    if(w==='AND') raw.push('&');else if(w==='OR') raw.push('|');else if(w==='NOT') raw.push('!');
    else{if(!validAddr(w)) throw Error(`Unknown address ${w}. ${ADDR_HELP}`);raw.push({a:w})}
  }
  const tk=[];
  for(const t of raw){
    const prev=tk[tk.length-1];
    if(prev&&(prev.a||prev.n!=null||prev===')')&&(t.a||t==='('||t==='!')) tk.push('&');
    tk.push(t);
  }
  if(!tk.length) return {t:'s',k:[]};
  let p=0;
  const expr=()=>{const k=[term()];while(tk[p]==='|'){p++;k.push(term())}return k.length>1?{t:'p',k}:k[0]};
  const term=()=>{const k=[fac()];while(tk[p]==='&'){p++;k.push(fac())}return k.length>1?{t:'s',k}:k[0]};
  const atom=(nc)=>{
    const t=tk[p];p++;
    if(t.a.startsWith('AI')){
      const o=tk[p],n=tk[p+1];
      if(!o||!o.op||!n||n.n==null) throw Error(`${t.a} is an analog value: compare it, e.g. ${t.a} < 10`);
      p+=2;return {t:'c',a:t.a,nc,cmp:{op:o.op,v:n.n}};
    }
    if(tk[p]&&tk[p].op) throw Error(`Only analog AI values can be compared (${t.a} is a bit)`);
    return {t:'c',a:t.a,nc};
  };
  const fac=()=>{
    const t=tk[p];
    if(t==='!'){p++;const n=tk[p];if(n&&n.a) return atom(true);throw Error('NOT (!) must be followed by a single address')}
    if(t==='('){p++;const e=expr();if(tk[p]!==')') throw Error('Missing closing bracket');p++;return e}
    if(t&&t.a) return atom(false);
    throw Error(t?`Unexpected "${t.op||t.n||t}"`:'Expression ends too early');
  };
  const r=expr();
  if(p<tk.length){const t=tk[p];throw Error(`Unexpected "${t.a||t.op||t.n||t}"`)}
  return r;
}
function compile(e){
  e=e||'';if(CC.has(e)) return CC.get(e);
  let r;try{r={tree:parse(e)}}catch(x){r={err:x.message}}
  CC.set(e,r);return r;
}
function outErr(r){
  const a=String(r.addr||'').toUpperCase();
  if(r.type==='TON') return RX.T.test(a)?'':'A TON output needs a timer address such as T0';
  return (RX.Y.test(a)||RX.M.test(a))?'':'Coil address must be an output such as Y0.0 or a memory bit such as M0';
}
function cmpOk(v,op,x){if(!isFinite(v)) return false;switch(op){case '<':return v<x;case '>':return v>x;case '<=':return v<=x;case '>=':return v>=x;case '=':return Math.abs(v-x)<1e-9;case '<>':return v!==x}return false}
function evalNode(n,st){if(n.t==='c'){const v=n.cmp?cmpOk(st.AI[n.a],n.cmp.op,n.cmp.v):readBit(st,n.a);return n.nc?!v:v}if(n.t==='s') return n.k.every(k=>evalNode(k,st));return n.k.some(k=>evalNode(k,st))}
function readBit(st,a){
  switch(a[0]){
    case 'X':return !!st.X[a];
    case 'Y':return !!st.Y[a];
    case 'M':return !!st.M[a];
    case 'T':return !!(st.T[a]&&st.T[a].dn);
  }
  return false;
}
function readAnalog(c,m,n){
  const st=m.st;st.v=[];if(!st.pw) return;
  const types={ai4:'pt',rtd4:'rtd',tc4:'tc'}[m.type];
  const devs=S.comps.filter(d=>d.type===types);
  for(let ch=1;ch<=4;ch++){
    let val=m.type==='ai4'?0:NaN;
    if(m.type==='ai4'){
      const r=n.f(`${m.id}:I${ch}+`);
      const d=devs.find(d=>n.f(d.id+':-')===r&&n.g(d.id,'+')==='+24');
      if(d&&n.g(m.id,`VI${ch}-`)==='0V'){const p=procByTag(d.props.pv);if(p) val=mAof(p,p.st.v)}
    }else if(m.type==='rtd4'){
      const d=devs.find(d=>n.f(d.id+':A')===n.f(`${m.id}:L${ch}+`)&&n.f(d.id+':B')===n.f(`${m.id}:L${ch}-`));
      if(d){const p=procByTag(d.props.pv);if(p) val=p.st.v}
    }else{
      const d=devs.find(d=>n.f(d.id+':+')===n.f(`${m.id}:I${ch}+`)&&n.f(d.id+':-')===n.f(`${m.id}:I${ch}-`));
      if(d){const p=procByTag(d.props.pv);if(p) val=p.st.v}
    }
    st.v[ch]=val;
    c.st.AI[`AI${+m.props.slot||1}.${ch}`]=val;
  }
}
function scan(c,n,dt){
  const st=c.st,gs=n.g(c.id,'S/S');
  for(let i=0;i<16;i++) st.X['X0.'+i]=!!(st.pw&&en(n.g(c.id,'X0.'+i),gs,'any'));
  st.AI={};
  for(const m of modsOf(c)){
    const sl=+m.props.slot||1;
    if(m.type==='di16'){const ms=n.g(m.id,'S/S');m.st.on=[];for(let i=0;i<16;i++){const v=!!(st.pw&&en(n.g(m.id,String(i)),ms,'any'));st.X[`X${sl}.${i}`]=v;m.st.on[i]=v}}
    else if(m.type!=='do16') readAnalog(c,m,n);
  }
  if(!(st.pw&&st.run)){st.Y={};st.T={};if(!st.pw) st.M={};return}
  for(const r of c.props.prog||[]){
    const cc=compile(r.expr);if(cc.err||outErr(r)) continue;
    const cond=evalNode(cc.tree,st);const a=String(r.addr).toUpperCase();
    const w=v=>{if(a[0]==='Y') st.Y[a]=v;else st.M[a]=v};
    if(r.type==='OTE') w(cond);
    else if(r.type==='SET'){if(cond) w(true)}
    else if(r.type==='RST'){if(cond) w(false)}
    else if(r.type==='TON'){
      const t=st.T[a]||(st.T[a]={acc:0,dn:false});const pt=Math.max(0,+r.pt||0);
      if(cond){t.acc=Math.min(pt,t.acc+dt*1000);t.dn=t.acc>=pt}else{t.acc=0;t.dn=false}
      t.pt=pt;
    }
  }
}

/* ---------- simulation loop ---------- */
function log(msg,cls=''){sim.log.push({t:sim.t,msg,cls});if(sim.log.length>200) sim.log.shift();sim.logVer++}
function processTick(dt){
  for(const c of S.comps){
    if(c.type!=='proc') continue;
    const p=c.props,lo=+p.lo,hi=+p.hi;
    const tags=String(p.rise||'').split(/[,\s]+/).filter(Boolean);
    const act=tags.some(t=>S.comps.some(d=>d.tag===t&&isActive(d)));
    c.st.v=clamp((c.st.v??+p.init)+((act?+p.rate||0:0)-(+p.fall||0))*dt,Math.min(lo,hi),Math.max(lo,hi));
  }
  for(const c of S.comps){
    const p=c.props;
    if(c.type==='lsw'){const v=pvVal(p.pv);c.st.s=[1,2,3].map(i=>v!=null&&(p['a'+i]==='below'?v<=+p['sp'+i]:v>=+p['sp'+i]))}
    else if(c.type==='psw'){const v=pvVal(p.pv);if(v==null) continue;if(v>=+p.sp) c.st.op=true;else if(v<=+p.sp-(+p.diff||0)) c.st.op=false}
    else if(c.type==='flr'){const v=pvVal(p.pv);if(v==null) continue;const low=p.mode!=='pump down';
      if(low){if(v<+p.e2) c.st.l=true;else if(v>+p.e1) c.st.l=false}else{if(v>+p.e1) c.st.l=true;else if(v<+p.e2) c.st.l=false}}
  }
}
function tick(adv=true){
  const dt=adv?0.05:0;
  if(adv) sim.t+=dt;
  processTick(dt);
  for(const c of S.comps){
    if(c.type==='timer'&&c.st.k){c.st.el=Math.min(+c.props.preset||0,(c.st.el||0)+dt);if(c.st.el>=(+c.props.preset||0)-1e-9) c.st.done=true}
    if(c.type==='psu'&&c.st.ol>0) c.st.ol-=dt;
    if(c.type==='vfd'){const tgt=c.st.run?+c.props.hz||50:0,step=(+c.props.hz||50)/Math.max(.1,+c.props.ramp||3)*dt;c.st.hz=c.st.hz||0;c.st.hz=c.st.hz<tgt?Math.min(tgt,c.st.hz+step):Math.max(tgt,c.st.hz-step*2)}
  }
  let n=solve();
  for(const c of S.comps) if(c.type==='plc') scan(c,n,dt);
  n=solve();
  sim.net=n;
  transitions();
  render();liveDrawer();
  if(!$('#insp').contains(document.activeElement)) renderInspector();
  status();
}
function transitions(){
  for(const c of S.comps){
    const st=c.st;
    if(c.type==='contactor'||c.type==='relay'){if(!!st.k!==!!st._k){log(`${c.tag} ${st.k?'pulled in':'dropped out'}`);st._k=!!st.k}}
    else if(c.type==='timer'){if(!!st.done!==!!st._d){if(st.done) log(`${c.tag} timed out after ${fmt(c.props.preset)} s`);st._d=!!st.done}}
    else if(c.type==='motor'){if((st.m||'off')!==(st._m||'off')){
      log(`${c.tag} ${{fwd:'running clockwise',rev:'running counter-clockwise',hum:'single-phasing: only two phases present',off:'stopped'}[st.m||'off']}`,st.m==='hum'?'f':'');st._m=st.m}}
    else if(c.type==='plc'){const k=st.pw&&st.run;if(!!k!==!!st._r){log(`${c.tag} ${k?'in RUN':st.pw?'in STOP':'has no 24 V supply'}`,k?'':'w');st._r=!!k}}
    else if(c.type==='pfr'){if(st.why!==st._w){if(st._w!==undefined||st.why!=='NO SUPPLY') log(`${c.tag} ${st.why==='OK'?'phases healthy, contact 11-14 closed':st.why.toLowerCase()}`,st.why==='OK'?'':'f');st._w=st.why}}
    else if(c.type==='psw'){if(!!st.op!==!!st._o){log(`${c.tag} ${st.op?'opened: high pressure':'closed again'}`,st.op?'w':'');st._o=!!st.op}}
    else if(c.type==='flr'){if(!!st.k!==!!st._k){log(`${c.tag} ${st.k?'energised: level beyond E2':'released'}`,st.k?'w':'');st._k=!!st.k}}
    else if(c.type==='vfd'){if(!!st.run!==!!st._r){log(`${c.tag} ${st.run?'run command on':'run command off'}`);st._r=!!st.run}}
  }
}
function startSim(){
  if(sim.running) return;
  S.comps.forEach(c=>c.st=initSt(c));
  sim.running=true;sim.t=0;sim.log=[];sim.logVer++;sim.faultKey='';ui.pending=null;ui.probeA=ui.probeB=null;ui.probe='';
  if(ui.tool==='delete') ui.tool='select';
  log('Simulation started');
  sim.timer=setInterval(()=>tick(true),50);
  tick(false);chrome();
}
function stopSim(){
  if(!sim.running) return;
  clearInterval(sim.timer);sim.running=false;sim.net=null;sim.fault=null;sim.warn=null;
  S.comps.forEach(c=>c.st=initSt(c));
  if(ui.tool==='probe') ui.tool='select';
  ui.probeA=ui.probeB=null;ui.probe='';
  log('Simulation stopped');
  render();renderInspector();renderDrawer();chrome();status();
}
function act(cid,a,phase){
  const c=byId(cid);if(!c) return;
  if(a==='press'){c.st.pr=phase==='down'}
  else{
    if(phase!=='down') return;
    if(a==='toggle'){
      if(c.type==='mcb1'||c.type==='mcb3'){if(c.st.tr){c.st.tr=false;c.st.on=true;log(`${c.tag} reset`)}else{c.st.on=!c.st.on;log(`${c.tag} switched ${c.st.on?'on':'off'}`)}}
      else if(c.type==='fuse'){if(!c.st.ok){c.st.ok=true;c.st.out=false;log(`${c.tag} replaced`)}else{c.st.out=!c.st.out;log(`${c.tag} ${c.st.out?'pulled out':'refitted'}`)}}
      else if(c.type==='estop'){c.st.lt=!c.st.lt;log(`${c.tag} ${c.st.lt?'pressed (latched)':'released'}`,c.st.lt?'w':'')}
      else if(c.type==='sel2'){c.st.pos=!c.st.pos;log(`${c.tag} to position ${c.st.pos?'I':'0'}`)}
      else if(c.type==='ls'){c.st.a=!c.st.a}
    }
    else if(a==='test'){if(!c.st.tr){c.st.tr=true;log(`${c.tag} tripped (test button)`,'w')}}
    else if(a==='reset'){if(c.st.tr){c.st.tr=false;log(`${c.tag} reset`)}}
    else if(a==='run'){c.st.run=!c.st.run}
    else if(a==='up'||a==='dn'){const p=c.props,span=(+p.hi-+p.lo)||1;c.st.v=clamp((c.st.v??+p.init)+(a==='up'?1:-1)*span*.05,Math.min(+p.lo,+p.hi),Math.max(+p.lo,+p.hi))}
  }
  tick(false);
}

/* ---------- wire routing ---------- */
const svg=$('#cv'),world=$('#world');
const RC={key:'',map:new Map()};
function manualRoute(w,A,B){
  const sa=A.side==='t'?-1:1,sb=B.side==='t'?-1:1,ay1=A.y+sa*14,by1=B.y+sb*14;
  const ok=y=>(sa<0?y<=A.y-8:y>=A.y+8)&&(sb<0?y<=B.y-8:y>=B.y+8);
  if(w.mx==null&&ok(w.my)) return {mode:3,pts:[[A.x,A.y],[A.x,w.my],[B.x,w.my],[B.x,B.y]]};
  const mx=w.mx??(Math.abs(A.x-B.x)>40?(A.x+B.x)/2:Math.max(A.x,B.x)+40);
  return {mode:5,pts:[[A.x,A.y],[A.x,ay1],[mx,ay1],[mx,by1],[B.x,by1],[B.x,B.y]]};
}
function pathCost(pts,R,segs,bound){
  let hits=0,ov=0,len=0;
  for(let i=0;i<pts.length-1;i++){
    const [x0,y0]=pts[i],[x1,y1]=pts[i+1];
    if(x0===x1&&y0===y1) continue;
    const v=x0===x1,c=v?x0:y0,a=v?Math.min(y0,y1):Math.min(x0,x1),b=v?Math.max(y0,y1):Math.max(x0,x1);
    len+=b-a;
    for(const r of R){if(v?(c>r[0]+1&&c<r[2]-1&&b>r[1]+1&&a<r[3]-1):(c>r[1]+1&&c<r[3]-1&&b>r[0]+1&&a<r[2]-1)) hits++}
    if(hits*10000+len*.1>bound) return Infinity;
    for(const s of segs){if(s.v===v&&Math.abs(s.c-c)<5&&Math.min(b,s.b)-Math.max(a,s.a)>6) ov++}
    if(hits*10000+ov*400+len*.1>bound) return Infinity;
  }
  return hits*10000+ov*400+len*.1;
}
function autoRoute(A,B,R,segs){
  const sa=A.side==='t'?-1:1,sb=B.side==='t'?-1:1;
  let best=null;
  const tryP=(pts,extra,mode)=>{const c=pathCost(pts,R,segs,best?best.cost-extra:Infinity)+extra;if(!best||c<best.cost) best={cost:c,pts,mode}};
  const lo=Math.max(sa>0?A.y+12:-1e9,sb>0?B.y+12:-1e9),hi=Math.min(sa<0?A.y-12:1e9,sb<0?B.y-12:1e9);
  if(lo<=hi){
    let ys=[];
    if(lo>-1e9&&hi<1e9){const n=Math.min(40,Math.max(1,Math.floor((hi-lo)/6)));for(let i=0;i<=n;i++) ys.push(lo+(hi-lo)*i/n)}
    else if(lo>-1e9){for(let d=0;d<=260;d+=8) ys.push(lo+d)}
    else{for(let d=0;d<=260;d+=8) ys.push(hi-d)}
    const pref=lo>-1e9&&hi<1e9?(lo+hi)/2:(lo>-1e9?lo:hi);
    for(const y of ys){const my=Math.round(y);tryP([[A.x,A.y],[A.x,my],[B.x,my],[B.x,B.y]],Math.abs(my-pref)*.15,3)}
  }
  if(!best||best.cost>=10000){
    const x0=Math.min(A.x,B.x)-240,x1=Math.max(A.x,B.x)+240,mid=(A.x+B.x)/2;
    for(const s of [14,26,40]){
      const ay1=A.y+sa*s,by1=B.y+sb*s;
      for(let mx=x0;mx<=x1;mx+=12) tryP([[A.x,A.y],[A.x,ay1],[mx,ay1],[mx,by1],[B.x,by1],[B.x,B.y]],140+s+Math.abs(mx-mid)*.05,5);
    }
  }

}
function routeAll(){
  const key=S.comps.map(c=>c.id+c.type+'@'+c.x+','+c.y).join('|')+'#'+S.wires.map(w=>w.id+w.a+w.b+'~'+(w.my??'')+':'+(w.mx??'')).join('|');
  if(key===RC.key) return;
  RC.key=key;RC.map=new Map();
  const R=S.comps.map(c=>{const t=T[c.type];return [c.x,c.y,c.x+t.w,c.y+t.h]});
  const segs=[];
  const ws=S.wires.slice().sort((a,b)=>((a.my!=null||a.mx!=null)?0:1)-((b.my!=null||b.mx!=null)?0:1));
  for(const w of ws){
    const A=tp(w.a),B=tp(w.b);if(!A||!B) continue;
    const r=(w.my!=null||w.mx!=null)?manualRoute(w,A,B):autoRoute(A,B,R,segs);
    if(!r) continue;
    const p=r.pts;for(let i=0;i<p.length-1;i++){const [x0,y0]=p[i],[x1,y1]=p[i+1];const v=x0===x1;segs.push({v,c:v?x0:y0,a:v?Math.min(y0,y1):Math.min(x0,x1),b:v?Math.max(y0,y1):Math.max(x0,x1)})}
    RC.map.set(w.id,{mode:r.mode,d:'M'+p.map(q=>q.join(' ')).join('L')});
  }
}
function route(w){routeAll();return RC.map.get(w.id)||null}

/* ---------- rendering ---------- */
function termSvg(c,n,x,y,side,hide){
  const k=c.id+':'+n;const cls=(ui.probeA===k?' pa':'')+(ui.probeB===k?' pb':'')+(ui.pending===k?' pa':'');
  return (hide?'':`<text x="${x}" y="${side==='t'?13:y-5}" class="tl" text-anchor="middle">${esc(n)}</text>`)+
    `<g class="term${cls}" data-term="${esc(k)}" transform="translate(${x} ${y})"><circle r="9" class="thit"/><circle r="4.3" class="tscrew"/><line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" class="slt"/></g>`;
}
function drawComp(c){
  const t=T[c.type],w=t.w,h=t.h,sel=ui.sel&&ui.sel.kind==='comp'&&ui.sel.id===c.id;
  let sub=t.subf?t.subf(c):(t.sub||''),subc='';
  if(sub&&typeof sub==='object'){subc=sub.c;sub=sub.t}
  let s=`<g class="comp${sel?' sel':''}" data-cid="${c.id}" transform="translate(${c.x} ${c.y})">`;
  s+=`<g${t.act?` data-act="${t.act}" class="actg"`:''}><rect class="body" width="${w}" height="${h}" rx="4"/><rect class="band" y="18" width="${w}" height="18"/>`;
  if(w<=50) s+=`<text x="${w/2}" y="31.5" class="btag" text-anchor="middle">${esc(c.tag)}</text>`;
  else s+=`<text x="6" y="31.5" class="btag">${esc(c.tag)}</text>`+(sub?`<text x="${w-6}" y="31" class="bsub ${subc}" text-anchor="end">${esc(sub)}</text>`:'');
  s+=(t.draw?t.draw(c):'')+'</g>';
  for(const [n,x] of t.top) s+=termSvg(c,n,x,0,'t',t.hideTL);
  for(const [n,x] of t.bottom) s+=termSvg(c,n,x,h,'b',t.hideTL);
  return s+'</g>';
}
function renderW(){
  routeAll();
  const n=sim.running?sim.net:null,off=(-(performance.now()/40)%12).toFixed(1);
  let s='';
  for(const w of S.wires){
    const r=RC.map.get(w.id);if(!r) continue;
    const col=WC[w.color]||WC.red,sel=ui.sel&&ui.sel.kind==='wire'&&ui.sel.id===w.id;
    const flt=sim.fault&&sim.fault.wires.has(w.id);
    const g=n?n.gk(w.a):null,live=g&&LIVE.has(g);
    s+=`<g class="wire${sel?' sel':''}${flt?' flt':''}" data-wid="${w.id}"><path d="${r.d}" class="wcase"/><path d="${r.d}" class="wcore" stroke="${col.hex}"/>`+
      (w.color==='pe'?`<path d="${r.d}" class="wcore" stroke="#f2d01b" stroke-dasharray="7 7"/>`:'')+
      (live?`<path d="${r.d}" class="wlive" style="stroke-dashoffset:${off}"/>`:'')+`<path d="${r.d}" class="whit"/></g>`;
  }
  for(const c of S.comps) s+=drawComp(c);
  if(ui.pending&&ui.cursor){const A=tp(ui.pending);if(A) s+=`<path d="M${A.x} ${A.y}L${ui.cursor.x} ${ui.cursor.y}" class="pend"/>`}
  world.innerHTML=s;

  else if(sim.running&&sim.warn){b.hidden=false;b.className='banner w';b.textContent=sim.warn}

function setVB(){

function wpt(e){const r=svg.getBoundingClientRect();return {x:ui.view.x+(e.clientX-r.left)/ui.view.k,y:ui.view.y+(e.clientY-r.top)/ui.view.k}}
function zoomAt(cx,cy,f){

function fit(){

  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const c of S.comps){const t=T[c.type];x0=Math.min(x0,c.x);y0=Math.min(y0,c.y);x1=Math.max(x1,c.x+t.w);y1=Math.max(y1,c.y+t.h)}

/* ---------- status ---------- */
function grpLabel(g){return g==null?'floating':{L1:'L1 · 230 V to N',L2:'L2 · 230 V to N',L3:'L3 · 230 V to N',N:'N / PE · 0 V','+24':'+24 V DC','0V':'0 V DC'}[g]||g}
function volt(a,b){
  if(!a||!b) return 'no reading: a probe is on a floating point';
  if(a===b) return '0 V';
  const pa=PH.includes(a),pb=PH.includes(b);

/* ---------- persistence & undo ---------- */
function serialize(){return {app:'panel-bench',v:3,info:S.info||{},encl:encl(),lay:lay(),bopt:bopt(),boq:S.boq||{},boqx:S.boqx||[],site:site(),comps:S.comps.map(({id,type,x,y,tag,props,pos,dim,flen,spos,cab})=>({id,type,x,y,tag,props,pos,dim,flen,spos,cab})),wires:S.wires.map(w=>({...w}))}}
function migrate(d){
  if(d.v>=2) return d;
  const plcIds=new Set((d.comps||[]).filter(c=>c.type==='plc').map(c=>String(c.id)));
  const tm={'L+':'24V','M':'0V','1M':'S/S','1L':'CO'};
  const mt=k=>{const [cid,t]=splitKey(k);if(!plcIds.has(cid)) return k;let n=tm[t]||t;n=n.replace(/^I0\./,'X0.').replace(/^Q0\./,'Y0.');return cid+':'+n};
  const ma=s=>String(s||'').toUpperCase().replace(/\bI0\.([0-7])/g,'X0.$1').replace(/\bQ0\.([0-7])/g,'Y0.$1').replace(/\bM(\d+)\.([0-7])/g,(_,a,b)=>'M'+(+a*8+ +b));
  (d.wires||[]).forEach(w=>{w.a=mt(w.a);w.b=mt(w.b)});
  (d.comps||[]).forEach(c=>{if(c.type==='plc'&&c.props&&c.props.prog) c.props.prog.forEach(r=>{r.expr=ma(r.expr);r.addr=ma(r.addr)})});
  return d;
}
function load(d){
  d=migrate(d);
  const comps=[],ids=new Set();let mx=0;
  for(const c of d.comps||[]){
    if(!T[c.type]) continue;
    const props=Object.assign(JSON.parse(JSON.stringify(T[c.type].props)),c.props||{});
    comps.push({id:String(c.id),type:c.type,x:+c.x||0,y:+c.y||0,tag:String(c.tag||T[c.type].pre),props,pos:c.pos&&isFinite(+c.pos.x)&&isFinite(+c.pos.y)?{x:+c.pos.x,y:+c.pos.y}:undefined,dim:c.dim&&typeof c.dim==='object'?{...c.dim}:undefined,flen:c.flen!=null&&isFinite(+c.flen)?+c.flen:undefined,spos:c.spos&&isFinite(+c.spos.x)&&isFinite(+c.spos.y)?{x:+c.spos.x,y:+c.spos.y}:undefined,cab:c.cab&&typeof c.cab==='object'?{...c.cab}:undefined});ids.add(String(c.id));
    mx=Math.max(mx,+String(c.id).replace(/\D/g,'')||0);
  }
  S.comps=comps;
  S.wires=(d.wires||[]).filter(w=>w&&ids.has(splitKey(w.a)[0])&&ids.has(splitKey(w.b)[0])).map(w=>{mx=Math.max(mx,+String(w.id).replace(/\D/g,'')||0);return {...w,id:String(w.id)}});
  S.wires=S.wires.filter(w=>tp(w.a)&&tp(w.b));
  S.seq=mx+1;S.info=Object.assign({},d.info||{});
  loadLayout(d);
  S.comps.forEach(c=>c.st=initSt(c));
  ui.sel=null;ui.pending=null;RC.key='';
  if(ui.plcId&&!byId(ui.plcId)) ui.plcId=null;
}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('panel-bench-v1',JSON.stringify(serialize()))}catch(e){}},300)}
function pushUndo(){ui.undo.push(JSON.stringify(serialize()));if(ui.undo.length>80) ui.undo.shift()}
function undo(){
  if(!ui.undo.length){toast('Nothing to undo');return}
  if(sim.running) stopSim();

/* ---------- editing ---------- */
function nextTag(pre){let n=0;const re=new RegExp('^'+pre+'(\\d+)$');for(const c of S.comps){const m=re.exec(c.tag);if(m) n=Math.max(n,+m[1])}return pre+(n+1)}
function addComp(type,x,y){
  const t=T[type];pushUndo();
  const c={id:nid('c'),type,x:snap(x-t.w/2),y:snap(y-t.h/2),tag:nextTag(t.pre),props:JSON.parse(JSON.stringify(t.props))};
  if(MODS.has(type)){const same=S.comps.filter(m=>m.type===type||(type==='rtd4'||type==='tc4'||type==='ai4')&&['ai4','rtd4','tc4'].includes(m.type));if(same.length) c.props.slot=Math.max(...same.map(m=>+m.props.slot||1))+1}
  c.st=initSt(c);S.comps.push(c);ui.sel={kind:'comp',id:c.id};autoPlaceNew(c);

function delComp(id){pushUndo();S.comps=S.comps.filter(c=>c.id!==id);S.wires=S.wires.filter(w=>splitKey(w.a)[0]!==id&&splitKey(w.b)[0]!==id);if(ui.sel&&ui.sel.id===id) ui.sel=null;changed()}
function delWire(id){pushUndo();S.wires=S.wires.filter(w=>w.id!==id);if(ui.sel&&ui.sel.id===id) ui.sel=null;changed()}
function addWire(a,b){

  pushUndo();const nw={id:nid('w'),a,b,color:ui.color};if(ui.wsize) nw.size=+ui.wsize;S.wires.push(nw);changed();

function startPan(e){ui.drag={kind:'pan',sx:e.clientX,sy:e.clientY,vx:ui.view.x,vy:ui.view.y};$('#stage').classList.add('panning');svg.setPointerCapture(e.pointerId)}
function probeClick(k){
  if(!ui.probeA||ui.probeB){ui.probeA=k;ui.probeB=null;ui.probe=''}
  else{ui.probeB=k;const n=sim.net;ui.probe=`V(${tname(ui.probeA)} → ${tname(k)}) = ${volt(n&&n.gk(ui.probeA),n&&n.gk(k))}`}

svg.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button===1){startPan(e);return}
  if(e.pointerType==='mouse'&&e.button!==0) return;
  const p=wpt(e);
  const tEl=e.target.closest('[data-term]'),aEl=e.target.closest('[data-act]'),cEl=e.target.closest('[data-cid]'),wEl=e.target.closest('[data-wid]');
  const key=tEl&&tEl.dataset.term,cid=cEl&&cEl.dataset.cid,wid=wEl&&wEl.dataset.wid;
  if(sim.running){

    if(aEl&&cid&&!key){const a=aEl.dataset.act;act(cid,a,'down');if(a==='press'){ui.pressing=cid;svg.setPointerCapture(e.pointerId)}return}

  }

  }

  if(cid){const c=byId(cid);ui.sel={kind:'comp',id:cid};ui.drag={kind:'comp',id:cid,dx:p.x-c.x,dy:p.y-c.y,moved:false};svg.setPointerCapture(e.pointerId);render();renderInspector();return}
  if(wid){const r=route(wById(wid));ui.sel={kind:'wire',id:wid};ui.drag={kind:'wire',id:wid,mode:r?r.mode:3,moved:false};svg.setPointerCapture(e.pointerId);render();renderInspector();return}
  select(null);startPan(e);
});
let rafPending=false;
function renderSoon(){if(rafPending) return;rafPending=true;requestAnimationFrame(()=>{rafPending=false;render()})}
svg.addEventListener('pointermove',e=>{
  const p=wpt(e);ui.cursor=p;const d=ui.drag;
  const hk=d&&d.kind!=='wnew'?null:hoverKeyAt(e);
  if(hk!==ui.hover){ui.hover=hk;status()}

    case 'olr':return [st.tr?'Tripped: 95-96 open, 97-98 closed':'Healthy: 95-96 closed',!st.tr,st.tr];
    case 'pfr':return [{OK:'Phases healthy: 11-14 closed','PHASE LOSS':'Phase missing: 11-12 closed','WRONG SEQ':'Wrong phase sequence: 11-12 closed','NO SUPPLY':'No supply'}[st.why||'NO SUPPLY'],st.why==='OK',st.why&&st.why!=='OK'&&st.why!=='NO SUPPLY'];
    case 'pb_no':case 'pb_nc':return [st.pr?'Pressed':'Released',st.pr];

async function saveFile(name,blob){
  let dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
  if(dl){
    try{await dl.save({filename:name,data:blob});return 'saved'}
    catch(e){
      const c=e&&e.code;
      if(c==='declined') return 'declined';
      if(c==='rate_limited') throw Error('A save prompt is already open. Finish that one first.');
      if(!['unavailable','not_granted','capability_disabled','capability_removed'].includes(c)) throw Error(e&&e.message||'The file could not be saved.');
    }
  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  return 'saved';
}

/* ---------- PDF writer (lossless images, FlateDecode) ---------- */
const enc=new TextEncoder();
async function deflate(bytes){
  if(typeof CompressionStream==='undefined') return null;
  const cs=new CompressionStream('deflate');
  const out=new Blob([bytes]).stream().pipeThrough(cs);
  return new Uint8Array(await new Response(out).arrayBuffer());
}
async function canvasImage(cv){
  const ctx=cv.getContext('2d'),d=ctx.getImageData(0,0,cv.width,cv.height).data,n=cv.width*cv.height;
  const rgb=new Uint8Array(n*3);
  for(let i=0,j=0;i<n;i++,j+=4){rgb[i*3]=d[j];rgb[i*3+1]=d[j+1];rgb[i*3+2]=d[j+2]}
  const z=await deflate(rgb);
  if(z) return {filter:'FlateDecode',data:z,w:cv.width,h:cv.height};
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.95));
  return {filter:'DCTDecode',data:new Uint8Array(await blob.arrayBuffer()),w:cv.width,h:cv.height};
}
function buildPdf(images,title){
  const PW=1190.55,PH=841.89;
  const parts=[],offs=[];let len=0;
  const push=b=>{if(typeof b==='string') b=enc.encode(b);parts.push(b);len+=b.length};
  const obj=(n,body)=>{offs[n]=len;push(`${n} 0 obj\n`);body();push('\nendobj\n')};
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const np=images.length,first=4;
  const kids=images.map((_,i)=>`${first+i*3} 0 R`).join(' ');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Kids [${kids}] /Count ${np} >>`));
  const t=String(title||'Panel Bench').replace(/[()\\]/g,'').replace(/[^\x20-\x7e]/g,'');
  obj(3,()=>push(`<< /Title (${t}) /Producer (Panel Bench) /Creator (Panel Bench) >>`));
  images.forEach((im,i)=>{
    const pg=first+i*3,ct=pg+1,ix=pg+2;
    const cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    obj(pg,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${ix} 0 R >> >> /Contents ${ct} 0 R >>`));
    obj(ct,()=>{push(`<< /Length ${cs.length} >>\nstream\n`);push(cs);push('\nendstream')});
    obj(ix,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /${im.filter} /Length ${im.data.length} >>\nstream\n`);push(im.data);push('\nendstream')});
  });
  const nObj=first+np*3;
  const xref=len;
  let x=`xref\n0 ${nObj}\n0000000000 65535 f \n`;
  for(let i=1;i<nObj;i++) x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size ${nObj} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}

/* ---------- static connectivity (wires + terminal blocks) ---------- */
function staticNets(){
  const P=new Map(),f=k=>{let p=P.get(k);if(p===undefined){P.set(k,k);return k}if(p===k) return k;const r=f(p);P.set(k,r);return r};
  const u=(a,b)=>{const ra=f(a),rb=f(b);if(ra!==rb) P.set(ra,rb)};
  for(const w of S.wires) u(w.a,w.b);
  for(const c of S.comps) if(c.type==='tb') u(c.id+':a',c.id+':b');
  const members=new Map();
  for(const c of S.comps){const t=T[c.type];for(const [tn] of t.top.concat(t.bottom)){const k=c.id+':'+tn,r=f(k);if(!members.has(r)) members.set(r,[]);members.get(r).push(k)}}
  const num=new Map();let n=1;for(const w of S.wires){const r=f(w.a);if(!num.has(r)) num.set(r,n++)}
  return {f,members,num};
}

/* ---------- physical terminal position ---------- */
function tpPhys(k){
  const [cid,tn]=splitKey(k),c=byId(cid);if(!c) return null;
  const t=T[c.type],m=t.tm[tn];if(!m) return null;
  const f=faceOf(c);
  if(f!=='plate'&&f!=='door') return {c,face:'field'};
  if(!c.pos) return {c,face:f,unplaced:true};
  const d=phy(c);
  return {c,face:f,x:c.pos.x+m.x/t.w*d.w,y:c.pos.y+(m.s==='t'?0:d.h),side:m.s};
}

/* ---------- wire-duct network & physical routing ---------- */
function ductGraph(){
  const ds=lay().ducts.map(d=>{const w=dW(d.s);return d.o==='v'?{d,v:true,c:d.x+w/2,a:d.y,b:d.y+d.len,w}:{d,v:false,c:d.y+w/2,a:d.x,b:d.x+d.len,w}});
  const nodes=[],add=(di,t)=>{nodes.push({di,t,adj:[]});return nodes.length-1};
  const link=(i,j,l)=>{nodes[i].adj.push([j,l]);nodes[j].adj.push([i,l])};
  for(let i=0;i<ds.length;i++) for(let j=i+1;j<ds.length;j++){
    const A=ds[i],B=ds[j],tol=Math.max(A.w,B.w)/2+8;
    if(A.v!==B.v){
      const H=A.v?B:A,V=A.v?A:B,hi=A.v?j:i,vi=A.v?i:j;
      if(V.c>=H.a-tol&&V.c<=H.b+tol&&H.c>=V.a-tol&&H.c<=V.b+tol){const th=clamp(V.c,H.a,H.b),tv=clamp(H.c,V.a,V.b);link(add(hi,th),add(vi,tv),Math.abs(V.c-th)+Math.abs(H.c-tv))}
    }else if(Math.abs(A.c-B.c)<4&&B.a<=A.b+tol&&A.a<=B.b+tol){const t1=clamp(B.a,A.a,A.b),t2=clamp(t1,B.a,B.b);link(add(i,t1),add(j,t2),Math.abs(t1-t2))}
  }
  return {ds,nodes};
}
function entry(G,x,y,side){
  let best=null;

    let dist,t;
    if(!D.v){if(x<D.a-2||x>D.b+2) return;t=clamp(x,D.a,D.b);const dy=y-D.c;
      dist=side==='t'?(dy>=0?dy:-dy+80):side==='b'?(dy<=0?-dy:dy+80):Math.abs(dy)}
    else{if(y<D.a-2||y>D.b+2) return;t=clamp(y,D.a,D.b);dist=Math.abs(x-D.c)+(side?20:0)}
    if(!best||dist<best.dist) best={di:i,t,dist};
  });
  if(!best) G.ds.forEach((D,i)=>{const t=clamp(D.v?y:x,D.a,D.b),px=D.v?D.c:t,py=D.v?t:D.c,dist=Math.abs(px-x)+Math.abs(py-y);if(!best||dist<best.dist) best={di:i,t,dist}});
  return best;
}
function gpath(G,A,B){
  if(A.di===B.di) return {len:Math.abs(A.t-B.t),segs:[A.di]};
  const N=G.nodes,n=N.length,SN=n,TN=n+1,dist=new Array(n+2).fill(Infinity),prev=new Array(n+2).fill(-1),done=new Array(n+2).fill(false);
  dist[SN]=0;
  const pos=u=>u===SN?A:u===TN?B:N[u];
  const nb=u=>{
    if(u===SN){const r=[];N.forEach((x,i)=>{if(x.di===A.di) r.push([i,Math.abs(x.t-A.t)])});return r}
    const x=N[u],r=x.adj.slice();N.forEach((y,i)=>{if(i!==u&&y.di===x.di) r.push([i,Math.abs(y.t-x.t)])});
    if(x.di===B.di) r.push([TN,Math.abs(x.t-B.t)]);return r};

const PR={key:'',res:null};
function physRoutes(){
  const key=JSON.stringify([S.encl,S.lay,S.bopt,S.comps.map(c=>[c.id,c.type,c.pos,c.dim,c.flen]),S.wires.map(w=>[w.id,w.a,w.b,w.size,w.color])]);
  if(key===PR.key&&PR.res) return PR.res;
  const G=ductGraph(),o=bopt(),pl=plateR(),E=encl(),res={w:new Map(),fill:new Map(),fillPct:new Map()};
  const run=(P,Q)=>{
    const man=Math.abs(P.x-Q.x)+Math.abs(P.y-Q.y);

      const F=A.face==='field'?A:B,I=A.face==='field'?B:A;
      r.kind='field';r.dev=F.c.id;
      if(I.face==='field'){r.kind='outside'}

      else if(I.face==='plate'){const q=run(I,gland(I.x));r.len=q.len+o.loop+(pl.y+pl.h<E.H?E.H-pl.y-pl.h:0);r.segs=q.segs}
      else{const q=run(hinge,gland(pl.x+60));r.len=q.len+doorRun(I)+o.loop;r.segs=q.segs}
    }

    else if(A.face==='plate'&&B.face==='plate'){const q=run(A,B);r.len=q.len+2*o.loop;r.segs=q.segs}
    else if(A.face==='door'&&B.face==='door'){r.len=Math.abs(A.x-B.x)+Math.abs(A.y-B.y)+2*o.loop;r.kind='door'}
    else{const P=A.face==='plate'?A:B,D=A.face==='plate'?B:A,q=run(P,hinge);r.len=q.len+doorRun(D)+2*o.loop;r.segs=q.segs;r.kind='door'}

/* ---------- design checks ---------- */
function onRail(c){const d=phy(c),p=c.pos;if(!p) return false;const cy=p.y+d.h/2;
  return lay().rails.some(r=>Math.abs(r.y+RAILH/2-cy)<1.6&&p.x>=r.x-.6&&p.x+d.w<=r.x+r.len+.6)}

  const P=list.reduce((a,c)=>a+(phy(c).p||0),0),W=E.W/1000,H=E.H/1000,D=E.D/1000;
  const Ae=1.4*W*D+0.9*(W*H+2*H*D);

function layoutCheck(){
  const E=encl(),pl=plateR(),L=lay(),out=[],bad=new Set();
  const add=(lvl,msg,ids=[])=>{out.push({lvl,msg,ids});if(lvl==='err') ids.forEach(i=>bad.add(i))};
  const plate=S.comps.filter(c=>faceOf(c)==='plate'),door=S.comps.filter(c=>faceOf(c)==='door');
  const un=[...plate,...door].filter(c=>!c.pos);
  if(un.length) add('warn',`${un.length} part${un.length===1?' is':'s are'} not placed yet: ${un.slice(0,8).map(c=>c.tag).join(', ')}${un.length>8?'…':''}`,un.map(c=>c.id));
  const pp=plate.filter(c=>c.pos),dp=door.filter(c=>c.pos);
  for(const c of pp){const r=rectOf(c);
    if(r.x<pl.x-.5||r.y<pl.y-.5||r.x+r.w>pl.x+pl.w+.5||r.y+r.h>pl.y+pl.h+.5) add('err',`${c.tag} sticks out of the mounting plate`,[c.id]);
    if(phy(c).m==='din'&&!onRail(c)){add('warn',`${c.tag} is not clipped onto a DIN rail`,[c.id]);bad.add(c.id)}
    const hit=L.ducts.find(d=>ovl(r,ductR(d),.5));if(hit) add('err',`${c.tag} overlaps a wire duct`,[c.id]);
  }
  for(const list of [pp,dp]) for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
    const a=list[i],b=list[j];if(ovl(rectOf(a),rectOf(b),.5)) add('err',`${a.tag} and ${b.tag} overlap`,[a.id,b.id]);
  }
  const dr={x:15,y:15,w:E.W-30,h:E.H-30};
  for(const c of dp){const r=rectOf(c);if(r.x<dr.x||r.y<dr.y||r.x+r.w>dr.x+dr.w||r.y+r.h>dr.y+dr.h) add('err',`${c.tag} is too close to the door edge`,[c.id])}
  for(const d of L.ducts){const r=ductR(d);if(r.x<pl.x-.5||r.y<pl.y-.5||r.x+r.w>pl.x+pl.w+.5||r.y+r.h>pl.y+pl.h+.5) add('warn',`A ${d.s} duct runs off the plate`,[d.id])}
  for(const r of L.rails){const q=railR(r);if(q.x<pl.x-.5||q.x+q.w>pl.x+pl.w+.5||q.y<pl.y-.5||q.y+q.h>pl.y+pl.h+.5) add('warn','A DIN rail runs off the plate',[r.id]);

}
