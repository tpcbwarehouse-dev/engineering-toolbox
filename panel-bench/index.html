    const k=CS.list.find(k=>k.c.id===c.id),cab=c.cab||{};
    let h=`<div class="ih"><span class="itag">${esc(c.tag)}</span><span class="itype">${esc(T[c.type].name)}</span></div>`;
    if(sim.running){const t=stateText(c);if(t) h+=`<div class="state${t[2]?' f':t[1]?' on':''}">${esc(t[0])}</div>`}
    h+=`<div class="fld3" style="margin-top:8px"><label>X (m)<input id="s-x" type="number" step="0.1" value="${c.spos?c.spos.x:''}"></label><label>Y (m)<input id="s-y" type="number" step="0.1" value="${c.spos?c.spos.y:''}"></label><label>&nbsp;<input value="site" readonly></label></div>`;
    if(!k){el.innerHTML=h+`<p class="idesc" style="margin-top:12px">Not wired to the panel, so it has no cable yet.</p>`;return}
    h+=`<h4>Cable</h4><label class="fld"><span>Cable no.</span><input id="s-ctag" value="${esc(cab.tag||'')}" placeholder="${esc('W-'+c.tag)}" maxlength="14"></label>
      <label class="fld"><span>Type</span><select id="s-ctype"><option value="">Auto · ${esc(CTYPES[k.auto].n)}</option>${Object.entries(CTYPES).map(([id,t])=>`<option value="${id}"${cab.type===id?' selected':''}>${esc(t.n)}</option>`).join('')}</select></label>
      <div class="fld3"><label>Cores<input id="s-ccores" type="number" min="1" value="${cab.cores||''}" placeholder="${k.ty.std.find(n=>n>=k.used+k.spare)||k.used+k.spare}"></label><label>Spare<input id="s-cspare" type="number" min="0" value="${cab.spare||''}" placeholder="0"></label>
      <label>Size mm²<select id="s-csize"><option value="">Auto ${k.size}</option>${WSIZES.map(z=>`<option value="${z}"${+cab.size===z?' selected':''}>${z}</option>`).join('')}</select></label></div>
      <label class="fld" style="margin-top:8px"><span>Length (m)</span><input id="s-clen" type="number" min="0" step="0.1" value="${k.ovr?cab.len:''}" placeholder="auto ${k.autoLen.toFixed(1)}"></label>
      <p class="idesc" style="margin:4px 0 0">${esc(k.ty.spec)}</p>
      <h4>Length build-up</h4><div class="stats"><span>Route</span><span>${k.rt.free?'straight estimate ':'via '+(k.rt.segs.map(id=>runTag(st.runs.find(r=>r.id===id))).join(' → ')||'—')+' · '}${k.rt.len.toFixed(1)} m</span>
       ${k.rt.free?'':`<span>Free drop</span><span>${k.rt.dropB.toFixed(1)} m to the device${o.flex?` (flexible conduit ${k.flex})`:''}</span>`}
       <span>Inside panel</span><span>${k.inside.toFixed(1)} m to the terminals</span><span>Tails + rise</span><span>${(o.ptail+o.dtail+o.vert).toFixed(1)} m</span>
       <span>Slack</span><span>${o.slack}%</span><span>Cable</span><span><b>${k.len.toFixed(1)} m</b>${k.ovr?' (fixed)':''} · OD ≈ ${k.od} mm · gland ${k.gland}${k.ty.scr?' EMC':''}</span></div>
      <h4>Core allocation</h4><ul class="tlist">${k.terms.map((t,i)=>`<li class="n">${i+1}</li><span class="v">${esc(c.tag)}:${esc(t.tn)} ↔ ${esc(t.far.join(', '))}</span>`).join('')}${k.cores>k.used?`<li class="n">${k.used+1}${k.cores>k.used+1?'–'+k.cores:''}</li><span class="v">spare</span>`:''}</ul>`;
    const iss=siteCheck().out.filter(x=>x.ids.includes(c.id));if(iss.length) h+=`<h4>Checks</h4><ul class="chk">${iss.map(x=>`<li class="${x.lvl}">${esc(x.msg)}</li>`).join('')}</ul>`;
    el.innerHTML=h;return;
  }
  if(s&&s.kind==='run'){
    const r=st.runs.find(x=>x.id===s.id);if(!r){ui.ssel=null;return renderSInspector()}
    const f=CS.pct.get(r.id)||{p:0,lim:40,n:0},users=CS.use.get(r.id)||[];
    el.innerHTML=`<div class="ih"><span class="itag">${runTag(r)}</span><span class="itype">${r.k==='tray'?'Cable tray':'Conduit'} · ${runLen(r).toFixed(1)} m</span></div>
     <label class="fld"><span>Kind</span><select id="s-rk"><option value="tray"${r.k==='tray'?' selected':''}>Cable tray</option><option value="conduit"${r.k==='conduit'?' selected':''}>Conduit</option></select></label>
     <label class="fld"><span>Size</span><select id="s-rs">${(r.k==='tray'?TRAYS:CONDUITS.map(c=>c[0])).map(x=>`<option${x===r.s?' selected':''}>${esc(x)}</option>`).join('')}</select></label>
     <label class="fld"><span>Use</span><select id="s-rc">${Object.entries(RUNCLS).map(([k,l])=>`<option value="${k}"${(r.cls||'mixed')===k?' selected':''}>${l}</option>`).join('')}</select></label>
     <div class="fld3"><label>From X<input id="s-ax" type="number" step="0.1" value="${r.a[0]}"></label><label>From Y<input id="s-ay" type="number" step="0.1" value="${r.a[1]}"></label><label>&nbsp;</label><label>To X<input id="s-bx" type="number" step="0.1" value="${r.b[0]}"></label><label>To Y<input id="s-by" type="number" step="0.1" value="${r.b[1]}"></label></div>
     <h4>Fill</h4><div class="state${f.p>f.lim?' f':' on'}">${f.p.toFixed(0)}% of ${r.k==='tray'?r.s+' mm':'ID '+condID(r.s)+' mm'} · limit ${f.lim}%</div>
     <h4>Cables (${users.length})</h4><p class="idesc" style="margin:0">${users.map(k=>`${esc(k.tag)} (${coresLabel(k)}×${k.size}, Ø${k.od})`).join(', ')||'None yet'}</p>
     <div class="acts"><button class="btn danger" data-scmd="del">Delete run</button></div>`;return;
  }
  if(s&&s.kind==='panel'){const P=st.panel;
    el.innerHTML=`<div class="ih"><span class="itag">${esc(st.ptag)}</span><span class="itype">Control panel</span></div><p class="idesc">All field cables start at the gland plate at the bottom of the panel.</p>
     <label class="fld"><span>Panel tag</span><input id="s-ptag" value="${esc(st.ptag)}" maxlength="12"></label><div class="fld3"><label>X (m)<input id="s-px" type="number" step="0.1" value="${P.x}"></label><label>Y (m)<input id="s-py" type="number" step="0.1" value="${P.y}"></label><label>&nbsp;</label></div>`;return}
  const chk=siteCheck(),byT={};for(const k of CS.list) byT[k.ty.n]=(byT[k.ty.n]||0)+k.len;
  el.innerHTML=`<div class="ih"><span class="itag" style="font-size:20px">Site &amp; cables</span></div><p class="idesc">Draw cable trays and conduits on the plan, then drag each field device to where it really is. Cables follow the shortest route of the right class: signal cables keep out of power trays.</p>
   <h4>Length allowances</h4>
   ${fld('s-ptail','Panel tail (m)',o.ptail,'number','min="0" step="0.1" title="Cable from the gland up to the terminals, beyond the wire length inside"')}${fld('s-dtail','Device tail (m)',o.dtail,'number','min="0" step="0.1"')}${fld('s-vert','Rise / drop (m)',o.vert,'number','min="0" step="0.1" title="Vertical runs up to the tray and down to the device"')}${fld('s-slack','Slack (%)',o.slack,'number','min="0" step="1"')}
   <label class="fld"><span>Drops</span><select id="s-flex"><option value="1"${o.flex?' selected':''}>Flexible conduit</option><option value="0"${o.flex?'':' selected'}>Free / clipped</option></select></label>
   <h4>Summary</h4><div class="stats"><span>Cables</span><span>${CS.list.length}</span>${Object.entries(byT).map(([t,m])=>`<span>${esc(t)}</span><span>${m.toFixed(0)} m</span>`).join('')}
   <span>Tray</span><span>${st.runs.filter(r=>r.k==='tray').reduce((a,r)=>a+runLen(r),0).toFixed(1)} m</span><span>Conduit</span><span>${st.runs.filter(r=>r.k==='conduit').reduce((a,r)=>a+runLen(r),0).toFixed(1)} m</span></div>
   <h4>Checks</h4><ul class="chk">${chk.out.length?chk.out.map(x=>`<li class="${x.lvl}" data-spick="${esc(x.ids[0]||'')}">${esc(x.msg)}</li>`).join(''):'<li class="ok">No problems found.</li>'}</ul>
   <p class="idesc" style="margin-top:10px">Fill limits: tray 40% of W×H; conduit 53% for one cable, 31% for two, 40% for three or more. Cable OD is estimated from cores and size; enter the manufacturer's OD by overriding the size or cores if needed.</p>`;
}
let sUndo=false;
insp.addEventListener('focusin',()=>{sUndo=false});
insp.addEventListener('input',e=>{
  if(ui.mode!=='site') return;const id=e.target.id;if(!id.startsWith('s-')) return;
  const v=e.target.value,n=parseFloat(v),st=site(),s=ui.ssel,once=()=>{if(!sUndo){pushUndo();sUndo=true}};
  if(['s-ptail','s-dtail','s-vert','s-slack'].includes(id)){if(!isFinite(n)) return;once();st.opt[id.slice(2)]=Math.max(0,n)}
  else if(id==='s-flex'){once();st.opt.flex=v==='1'}
  else if(id==='s-ptag'){once();st.ptag=v.trim()||'CP1'}
  else if(id==='s-px'||id==='s-py'){if(!isFinite(n)) return;once();st.panel[id.slice(3)]=n}
  else if(s&&s.kind==='dev'){const c=byId(s.id);if(!c) return;once();c.cab=c.cab||{};
    if(id==='s-x'||id==='s-y'){if(!isFinite(n)) return;c.spos=c.spos||{x:0,y:0};c.spos[id.slice(2)]=n}
    else if(id==='s-ctag') c.cab.tag=v.trim();else if(id==='s-ctype') c.cab.type=v;
    else if(id==='s-ccores') c.cab.cores=isFinite(n)&&n>0?Math.round(n):'';else if(id==='s-cspare') c.cab.spare=isFinite(n)?Math.max(0,Math.round(n)):'';
    else if(id==='s-csize') c.cab.size=v?+v:'';else if(id==='s-clen') c.cab.len=v.trim()===''?'':(isFinite(n)?n:c.cab.len)}
  else if(s&&s.kind==='run'){const r=st.runs.find(x=>x.id===s.id);if(!r) return;once();
    if(id==='s-rk'){r.k=v;r.s=v==='tray'?'150x50':'1"'}else if(id==='s-rs') r.s=v;else if(id==='s-rc') r.cls=v;
    else if(isFinite(n)){if(id==='s-ax') r.a[0]=n;else if(id==='s-ay') r.a[1]=n;else if(id==='s-bx') r.b[0]=n;else if(id==='s-by') r.b[1]=n}}
  save();render();if(ui.tab==='cables'&&!ui.collapsed) renderCables();
  if(['s-ctype','s-csize','s-rk','s-flex'].includes(id)) renderInspector();
});
insp.addEventListener('change',e=>{if(ui.mode==='site'&&e.target.id.startsWith('s-')){renderInspector();renderLib()}});
insp.addEventListener('click',e=>{
  if(ui.mode!=='site') return;
  const li=e.target.closest('[data-spick]');if(li&&li.dataset.spick){const id=li.dataset.spick;if(byId(id)) sselect('dev',id);else sselect('run',id);return}
  const b=e.target.closest('[data-scmd]');if(b&&b.dataset.scmd==='del'){if(sim.running) stopSim();sdelete()}
});

/* ---------- cable schedule (drawer tab) ---------- */
function renderCables(){
  const CS=cableSchedule(),st=site(),sel=ui.ssel&&ui.ssel.kind==='dev'?ui.ssel.id:(ui.sel&&ui.sel.kind==='comp'?ui.sel.id:null);
  if(!CS.list.length){$('#drb').innerHTML=`<p class="empty">No field cables yet. A cable is created for every field device (motor, supply, sensor, valve, tower lamp…) that is wired to a panel terminal in Wiring &amp; logic.</p>`;return}
  let h=`<div class="phead"><b>Cable schedule · ${CS.list.length} cables · ${CS.list.reduce((a,k)=>a+k.len,0).toFixed(0)} m</b><span class="sp"></span><button class="btn" id="cs-csv">Export CSV</button></div>
  <div class="tblw"><table class="boq" style="min-width:1100px"><thead><tr><th>Cable</th><th>From</th><th>To</th><th>Type</th><th>Cores × mm²</th><th style="text-align:right">OD mm</th><th>Gland</th><th>Route</th><th style="text-align:right">Length m</th><th>Cores (device ↔ panel)</th></tr></thead><tbody>`;
  for(const k of CS.list) h+=`<tr data-csel="${k.c.id}" style="cursor:pointer${sel===k.c.id?';background:var(--accent-soft)':''}"><td><b>${esc(k.tag)}</b></td><td>${esc(st.ptag)}</td><td>${esc(k.c.tag)} · ${esc(T[k.c.type].name)}</td><td>${esc(k.ty.n)}</td><td class="n" style="text-align:left">${coresLabel(k)} × ${k.size} <span style="color:var(--muted)">(${k.used} used)</span></td><td class="n">${k.od}</td><td>${k.gland}${k.ty.scr?' EMC':''}</td><td class="tg">${k.rt.free?'direct (no tray)':esc(k.rt.segs.map(id=>runTag(st.runs.find(r=>r.id===id))).join(' → '))}</td><td class="n">${k.len.toFixed(1)}${k.ovr?'*':''}</td><td class="tg">${k.terms.map((t,i)=>`${i+1}:${esc(t.tn)}↔${esc(t.far[0]||'')}`).join(' · ')}</td></tr>`;
  h+=`</tbody></table></div><p class="phelp" style="margin-top:8px">* length fixed by hand. Click a row to select the device. Lengths = route + ${st.opt.ptail} m panel tail + ${st.opt.dtail} m device tail + ${st.opt.vert} m rise + wire inside the panel, plus ${st.opt.slack}% slack.</p>`;
  $('#drb').innerHTML=h;
}
function cableTable(){
  const CS=cableSchedule(),st=site(),out=[['Cable','From','To','Device','Type','Specification','Cores','Size mm²','Cores used','OD mm','Gland','Route','Length m','Core allocation']];
  for(const k of CS.list) out.push([k.tag,st.ptag,k.c.tag,T[k.c.type].name,k.ty.n,k.ty.spec,coresLabel(k),k.size,k.used,k.od,k.gland+(k.ty.scr?' EMC':''),k.rt.free?'direct':k.rt.segs.map(id=>runTag(st.runs.find(r=>r.id===id))).join(' > '),k.len.toFixed(1),k.terms.map((t,i)=>`${i+1}:${t.tn}=${t.far.join('/')}`).join('; ')]);
  return out;
}
$('#drb').addEventListener('click',async e=>{
  if(e.target.id==='cs-csv'){const csv='﻿'+cableTable().map(r=>r.map(v=>{const s=String(v??'');return /[",\n;]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}).join(',')).join('\r\n');
    try{const r=await saveFile(fileStem()+'_cable_schedule.csv',new Blob([csv],{type:'text/csv;charset=utf-8'}));if(r==='saved') toast('Cable schedule saved as CSV')}catch(x){toast(x.message)}return}
  const tr=e.target.closest('[data-csel]');if(tr){const id=tr.dataset.csel;if(ui.mode==='site') sselect('dev',id);else{ui.sel={kind:'comp',id};ui.ssel={kind:'dev',id};render();renderInspector();renderCables()}}
});

/* ---------- BOQ contribution ---------- */
function siteBoq(add,o){
  const CS=cableSchedule(),st=site(),G=CS.G;
  const g=new Map();
  for(const k of CS.list){const key=`${k.type}|${coresLabel(k)}|${k.size}`;if(!g.has(key)) g.set(key,{k,m:0,tags:[]});const x=g.get(key);x.m+=k.len;x.tags.push(k.tag)}
  for(const [key,x] of g) add('cab|'+key,'Field cable',`${x.k.ty.n} cable ${coresLabel(x.k)} × ${x.k.size} mm²`,`${x.k.ty.spec} · OD ≈ ${x.k.od} mm · ${x.tags.length} run${x.tags.length===1?'':'s'}, routed`,Math.ceil(x.m),'m',x.tags.join(', '));
  const gl=new Map();for(const k of CS.list){const key=k.gland+(k.ty.scr?' EMC':'');gl.set(key,(gl.get(key)||0)+1)}
  for(const [key,n] of [...gl].sort()) add('gl|'+key,'Accessories & consumables',`Cable gland ${key}${key.includes('EMC')?' (screen clamping)':''} IP68`,`For cables Ø ${GLANDS.find(x=>x[0]===key.split(' ')[0]).slice(1).join('–')} mm`,n,'pcs');
  const trays=new Map(),cond=new Map();
  for(const r of st.runs){const m=r.k==='tray'?trays:cond;if(!m.has(r.s)) m.set(r.s,[]);m.get(r.s).push(runLen(r))}
  for(const [s,ls] of trays){const m=ls.reduce((a,b)=>a+b,0);add('tray|'+s,'Cable route','Cable tray, perforated, hot-dip galvanised',`${s} mm (W×H) with cover · ${m.toFixed(1)} m net + 5%`,Math.ceil(m*1.05),'m');
    add('trsup|'+s,'Cable route',`Tray support / hanger for ${s}`,'Every 1.5 m',Math.ceil(m/1.5)+ls.length,'set')}
  const tj=G.joins.filter(([i,j])=>G.runs[i].k==='tray'&&G.runs[j].k==='tray').length;
  add('trfit','Cable route','Tray fitting (bend / tee / cross) with couplers','One per tray junction',tj,'pcs');
  for(const [s,ls] of cond){const m=ls.reduce((a,b)=>a+b,0),lengths=ls.reduce((a,l)=>a+Math.ceil(l/3),0);
    add('cd|'+s,'Cable route',`Conduit ${s} (EMT / IMC)`,`${ls.length} run${ls.length===1?'':'s'}, ${m.toFixed(1)} m · 3 m lengths`,lengths,'length 3 m');
    add('cdc|'+s,'Cable route',`Conduit coupling + connector ${s}`,'Joints + 2 ends per run',ls.reduce((a,l)=>a+Math.max(0,Math.ceil(l/3)-1)+2,0),'pcs');
    add('cds|'+s,'Cable route',`Conduit saddle / clamp ${s}`,'Every 1 m',Math.ceil(m),'pcs')}
  if(st.opt.flex){const fl=new Map();for(const k of CS.list){if(k.rt.free) continue;const m=k.rt.dropB+st.opt.dtail;if(!fl.has(k.flex)) fl.set(k.flex,{m:0,n:0});const x=fl.get(k.flex);x.m+=m;x.n++}
    for(const [s,x] of fl){add('flex|'+s,'Cable route',`Flexible conduit ${s}, liquid-tight`,`Drops from tray to ${x.n} device${x.n===1?'':'s'} + 10%`,Math.ceil(x.m*1.1),'m');add('flexc|'+s,'Cable route',`Flexible conduit connector ${s}`,'2 per drop',x.n*2,'pcs')}}
  add('cmark','Accessories & consumables','Cable marker (cable no.)','Both ends of every field cable',CS.list.length*2,'pcs');
}

/* ---------- PDF sheets ---------- */
async function siteSheet(){
  const off=$('#offscreen'),B=siteBounds(),vb=[B.x0-.5,B.y0-.5,B.x1-B.x0+1,B.y1-B.y0+2],aw=396,ah=281-TB.h-24,k=Math.min(aw/vb[2],ah/vb[3]);
  off.innerHTML=`<svg class="site" xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(' ')}" width="${Math.round(vb[2]*k*MM)}" height="${Math.round(vb[3]*k*MM)}">${siteInner({print:true})}</svg>`;
  const cl=inlineClone(off.querySelector('svg'));cl.style.display='block';const img=await svgImage(cl);off.innerHTML='';
  const CS=cableSchedule();
  return {title:'Site cable plan',draw:ctx=>{
    txt(ctx,'SITE CABLE PLAN',14,17,{size:5,w:700,f:PF.tag});
    txt(ctx,`${CS.list.length} field cables · ${CS.list.reduce((a,k)=>a+k.len,0).toFixed(0)} m · 1 mm on paper = ${(1000/(k)).toFixed(0)} mm on site · grid 1 m`,72,17,{size:2.6,c:MUTED});
    ctx.drawImage(img,14*MM,24*MM,vb[2]*k*MM,vb[3]*k*MM)}};
}
function cableSheets(){
  const t=cableTable().slice(1).map(r=>({0:r[0],1:`${r[1]} → ${r[2]}`,2:r[4],3:`${r[6]} × ${r[7]}`,4:r[9],5:r[10],6:r[11],7:r[12],8:r[13]}));
  return tableSheets('Cable schedule',[{h:'Cable',w:24,b:1,mono:1},{h:'From → to',w:34,mono:1},{h:'Type',w:30},{h:'Cores × mm²',w:26,mono:1},{h:'OD',w:14,mono:1},{h:'Gland',w:20},{h:'Route',w:40,mono:1},{h:'Length m',w:18,b:1,mono:1},{h:'Core allocation (device = panel terminal)',w:186,mono:1}],t,'Lengths routed along trays and conduits');
}

/* ---------- boot ---------- */
renderLib();chrome();
let saved=null;try{saved=JSON.parse(localStorage.getItem('panel-bench-v1')||'null')}catch(e){}
if(saved&&Array.isArray(saved.comps)&&saved.comps.length){load(saved);changed();requestAnimationFrame(fit)}
else loadExample('boiler',true);
setVB();
{let v0='wiring';try{v0=localStorage.getItem('panel-bench-view')||'wiring'}catch(e){}if(v0!=='wiring') setView(v0)}
requestAnimationFrame(frame);

})();

</script>
