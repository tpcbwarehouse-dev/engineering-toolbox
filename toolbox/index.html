<style>
  body { margin: 0; background: #0a0a0a; }
  html.theme-light body { background: #f1f5f9; }
  @media print {
    html, body { background: white !important; }
    .app-sidebar { display: none !important; }
  }

  /* ===== Light theme: remap the dark neutral tokens to a light slate palette =====
     The components are authored dark-first; this layer swaps the surface/text/border
     tokens (and low-contrast accent tints) when <html class="theme-light"> is set. */
  .theme-light .bg-neutral-950, .theme-light .bg-neutral-950\/95 { background-color: #f8fafc; }
  .theme-light .bg-neutral-900, .theme-light .bg-neutral-900\/60, .theme-light .bg-neutral-900\/50 { background-color: #ffffff; }
  .theme-light .bg-neutral-800 { background-color: #f1f5f9; }
  .theme-light .bg-neutral-500 { background-color: #94a3b8; }
  .theme-light .border-neutral-800 { border-color: #e2e8f0; }
  .theme-light .border-neutral-700 { border-color: #cbd5e1; }
  .theme-light .border-neutral-600 { border-color: #94a3b8; }
  .theme-light .border-neutral-400 { border-color: #64748b; }
  .theme-light .text-neutral-50, .theme-light .text-neutral-100 { color: #0f172a; }
  .theme-light .text-neutral-200, .theme-light .text-neutral-300 { color: #1e293b; }
  .theme-light .text-neutral-400 { color: #475569; }
  .theme-light .text-neutral-500 { color: #64748b; }
  .theme-light .text-neutral-600 { color: #64748b; }
  .theme-light .placeholder-neutral-500::placeholder { color: #94a3b8; }
  .theme-light .shadow-md { box-shadow: 0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.06); }
  .theme-light .backdrop-blur { backdrop-filter: none; }
  /* accent text on light surfaces */
  .theme-light .text-amber-400 { color: #b45309; }
  .theme-light .text-sky-400 { color: #0369a1; }
  .theme-light .text-emerald-400 { color: #047857; }
  .theme-light .text-red-400 { color: #dc2626; }
  .theme-light .text-lime-400 { color: #4d7c0f; }
  .theme-light .text-teal-400 { color: #0f766e; }
  .theme-light .text-violet-400 { color: #6d28d9; }
  .theme-light .text-cyan-400 { color: #0e7490; }
  .theme-light .text-orange-400 { color: #c2410c; }
  .theme-light .text-rose-400 { color: #be123c; }
  .theme-light .text-stone-400 { color: #57534e; }
  .theme-light .text-neutral-950 { color: #0f172a; }
  /* tinted notice boxes */
  .theme-light .bg-sky-950\/30 { background-color: #f0f9ff; }
  .theme-light .bg-amber-950\/30 { background-color: #fffbeb; }
  .theme-light .bg-emerald-950\/30 { background-color: #ecfdf5; }
  .theme-light .bg-red-950\/40, .theme-light .bg-red-950\/30 { background-color: #fef2f2; }
  .theme-light .border-sky-900 { border-color: #bae6fd; }
  .theme-light .border-amber-900 { border-color: #fde68a; }
  .theme-light .border-emerald-900 { border-color: #a7f3d0; }
  .theme-light .border-red-900 { border-color: #fecaca; }
  .theme-light .border-red-800 { border-color: #fca5a5; }
  /* selected-state buttons keep their accent fill; ensure text stays dark */
  .theme-light .bg-amber-500, .theme-light .bg-sky-500, .theme-light .bg-emerald-500 { color: #0f172a; }
  .theme-light input, .theme-light select, .theme-light textarea { color-scheme: light; }
  .theme-dark input, .theme-dark select, .theme-dark textarea { color-scheme: dark; }

  /* sidebar */
  .app-sidebar { scrollbar-width: thin; }
  .app-sidebar::-webkit-scrollbar { width: 6px; }
  .app-sidebar::-webkit-scrollbar-thumb { background: rgba(120,120,120,.35); border-radius: 3px; }

  /* visible keyboard focus (mouse clicks don't show it) */
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

.15\u20130.25) than transfer screws since they draw unevenly along the trough.":"Reclaim screw \u0E41\u0E1A\u0E1A live-bottom \u0E21\u0E31\u0E01 fill \u0E15\u0E48\u0E33\u0E01\u0E27\u0E48\u0E32 (0.15\u20130.25) \u0E40\u0E19\u0E37\u0E48\u0E2D\u0E07\u0E08\u0E32\u0E01\u0E14\u0E36\u0E07\u0E27\u0E31\u0E2A\u0E14\u0E38\u0E44\u0E21\u0E48\u0E2A\u0E21\u0E48\u0E33\u0E40\u0E2A\u0E21\u0E2D\u0E15\u0E32\u0E21\u0E23\u0E32\u0E07","Margin for starting torque under a full/loaded screw, wear, and minor blockages. 1.15\u20131.5 typical.":"\u0E40\u0E1C\u0E37\u0E48\u0E2D\u0E41\u0E23\u0E07\u0E1A\u0E34\u0E14\u0E2A\u0E15\u0E32\u0E23\u0E4C\u0E17\u0E02\u0E13\u0E30 screw \u0E40\u0E15\u0E47\u0E21/\u0E21\u0E35\u0E42\u0E2B\u0E25\u0E14 \u0E01\u0E32\u0E23\u0E2A\u0E36\u0E01\u0E2B\u0E23\u0E2D \u0E41\u0E25\u0E30\u0E01\u0E32\u0E23\u0E2D\u0E38\u0E14\u0E15\u0E31\u0E19\u0E40\u0E25\u0E47\u0E01\u0E19\u0E49\u0E2D\u0E22 \u0E17\u0E31\u0E48\u0E27\u0E44\u0E1B 1.15\u20131.5","Margin for starting torque under a loaded screw, wear, and blockages. 1.15\u20131.5 typical.":"\u0E40\u0E1C\u0E37\u0E48\u0E2D\u0E41\u0E23\u0E07\u0E1A\u0E34\u0E14\u0E2A\u0E15\u0E32\u0E23\u0E4C\u0E17\u0E02\u0E13\u0E30\u0E21\u0E35\u0E42\u0E2B\u0E25\u0E14 \u0E01\u0E32\u0E23\u0E2A\u0E36\u0E01\u0E2B\u0E23\u0E2D \u0E41\u0E25\u0E30\u0E01\u0E32\u0E23\u0E2D\u0E38\u0E14\u0E15\u0E31\u0E19 \u0E17\u0E31\u0E48\u0E27\u0E44\u0E1B 1.15\u20131.5","Needs ash sampling (carbon content, GCV of ash) to derive rigorously \u2014 enter your measured/estimated figure.":"\u0E15\u0E49\u0E2D\u0E07\u0E40\u0E01\u0E47\u0E1A\u0E15\u0E31\u0E27\u0E2D\u0E22\u0E48\u0E32\u0E07\u0E40\u0E16\u0E49\u0E32 (\u0E1B\u0E23\u0E34\u0E21\u0E32\u0E13\u0E04\u0E32\u0E23\u0E4C\u0E1A\u0E2D\u0E19, GCV \u0E02\u0E2D\u0E07\u0E40\u0E16\u0E49\u0E32) \u0E40\u0E1E\u0E37\u0E48\u0E2D\u0E04\u0E33\u0E19\u0E27\u0E13\u0E2D\u0E22\u0E48\u0E32\u0E07\u0E25\u0E30\u0E40\u0E2D\u0E35\u0E22\u0E14 \u2014 \u0E43\u0E2A\u0E48\u0E04\u0E48\u0E32\u0E17\u0E35\u0E48\u0E27\u0E31\u0E14/\u0E1B\u0E23\u0E30\u0E21\u0E32\u0E13","Per UG-3
